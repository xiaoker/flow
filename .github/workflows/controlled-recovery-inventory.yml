name: Controlled recovery inventory (read-only)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Fixed campaign start date"
        required: true
        default: "2024-08-01"
        type: string
      end_date:
        description: "Fixed campaign end date (inclusive)"
        required: true
        default: "2026-09-03"
        type: string
      priority_dates:
        description: "Comma-separated priority dates inside the fixed scope"
        required: true
        default: "2026-08-27,2026-08-28,2026-08-31,2026-09-01,2026-09-02,2026-09-03"
        type: string

permissions:
  contents: read

concurrency:
  group: controlled-recovery-inventory
  cancel-in-progress: false

jobs:
  inventory:
    name: Export bounded evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOW_PUBLIC_URL: ${{ vars.FLOW_PUBLIC_URL }}
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      FLOW_OFFICIAL_USAGE_EXPORT_JSON: ${{ secrets.FLOW_OFFICIAL_USAGE_EXPORT_JSON }}
      RECOVERY_ORIGIN_MAIN_SHA: ${{ github.sha }}
    steps:
      - name: Checkout read-only exporter
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Prepare isolated artifact directory
        run: mkdir -p "$RUNNER_TEMP/controlled-recovery"

      - name: Preflight scope and read-only permissions
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PRIORITY_DATES: ${{ inputs.priority_dates }}
        run: |
          set -eu
          if [ "$START_DATE" != "2024-08-01" ] || [ "$END_DATE" != "2026-09-03" ]; then
            echo '{"status":"INCOMPLETE","code":"fixed_scope_required"}' > "$RUNNER_TEMP/controlled-recovery/preflight-error.json"
            exit 2
          fi
          if [ -z "${FLOW_PUBLIC_URL:-}" ] || [ -z "${FLOW_INGEST_API_KEY:-}" ]; then
            echo '{"status":"INCOMPLETE","code":"required_read_credentials_missing"}' > "$RUNNER_TEMP/controlled-recovery/preflight-error.json"
            exit 2
          fi
          case "${PRIORITY_DATES}" in
            *2026-09-04*|*2026-09-05*|*2026-09-06*|*2026-09-07*)
              echo '{"status":"INCOMPLETE","code":"priority_date_outside_scope"}' > "$RUNNER_TEMP/controlled-recovery/preflight-error.json"
              exit 2
              ;;
          esac
          if [ -n "${FLOW_CF_ACCESS_CLIENT_ID:-}" ] && [ -z "${FLOW_CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo '{"status":"INCOMPLETE","code":"access_secret_pair_incomplete"}' > "$RUNNER_TEMP/controlled-recovery/preflight-error.json"
            exit 2
          fi
          if [ -z "${FLOW_CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${FLOW_CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo '{"status":"INCOMPLETE","code":"access_secret_pair_incomplete"}' > "$RUNNER_TEMP/controlled-recovery/preflight-error.json"
            exit 2
          fi

      - name: Prepare optional ephemeral official usage export
        if: ${{ success() }}
        run: |
          set -eu
          if [ -n "${FLOW_OFFICIAL_USAGE_EXPORT_JSON:-}" ]; then
            umask 077
            printf '%s' "$FLOW_OFFICIAL_USAGE_EXPORT_JSON" > "$RUNNER_TEMP/official-usage-export.json"
          fi

      - name: Export evidence and run offline auditor twice
        if: ${{ success() }}
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          PRIORITY_DATES: ${{ inputs.priority_dates }}
        run: |
          set -eu
          priority_args=()
          old_ifs="$IFS"
          IFS=','
          for priority in $PRIORITY_DATES; do
            priority_args+=(--priority-date "$priority")
          done
          IFS="$old_ifs"
          usage_args=()
          if [ -s "$RUNNER_TEMP/official-usage-export.json" ]; then
            usage_args+=(--usage-file "$RUNNER_TEMP/official-usage-export.json")
          fi
          PYTHONPATH=src:. python scripts/export_controlled_recovery_evidence.py \
            --base-url "$FLOW_PUBLIC_URL" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            "${priority_args[@]}" \
            --phase R0-D \
            --output-dir "$RUNNER_TEMP/controlled-recovery" \
            "${usage_args[@]}" \
            --config config/resource-budget.json

      - name: Remove ephemeral official usage export
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/official-usage-export.json"

      - name: Upload read-only evidence artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: controlled-recovery-inventory-${{ github.run_id }}
          path: ${{ runner.temp }}/controlled-recovery
          if-no-files-found: warn
          retention-days: 14
