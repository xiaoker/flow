name: ETF stock-flow history inventory

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First market-history date to probe"
        required: true
        default: "2026-07-01"
        type: string
      end_date:
        description: "Last market-history date to probe"
        required: true
        default: "2026-08-18"
        type: string

permissions:
  contents: read

concurrency:
  group: stock-flow-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install inventory tool
        run: python -m pip install -e '.[dev]'

      - name: Install Wrangler
        run: npm ci
        working-directory: web

      - name: Resolve official market-history dates
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          set -euo pipefail
          mkdir -p reports/stock-flow-inventory
          (cd web && npx wrangler d1 execute flow --remote --json \
            --command "SELECT trade_date FROM market_history_daily ORDER BY trade_date ASC;") \
            > reports/stock-flow-inventory/market-history-query.json
          python scripts/select_market_history_dates.py \
            --input reports/stock-flow-inventory/market-history-query.json \
            --output reports/stock-flow-inventory/dates.txt \
            --start "$START_DATE" \
            --end "$END_DATE"

      - name: Probe archived normalized metadata only
        run: |
          python scripts/inventory_stock_flow_inputs.py \
            --base-url "$FLOW_PUBLIC_URL" \
            --dates reports/stock-flow-inventory/dates.txt \
            --output reports/stock-flow-inventory/pcf-inventory.json \
            --attempts 2
          jq '{mode, availableDates, completeShareDates, pcfReadyDates}' \
            reports/stock-flow-inventory/pcf-inventory.json

      - name: Preserve inventory evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: stock-flow-inventory-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: reports/stock-flow-inventory/
