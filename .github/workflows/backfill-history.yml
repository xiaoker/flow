name: Backfill official market history

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "First trading date to archive"
        required: true
        default: "2024-08-01"
        type: string
      end_date:
        description: "Last trading date to archive"
        required: true
        default: "2026-07-21"
        type: string

permissions:
  contents: read

concurrency:
  group: history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1, Node 24

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -e '.[dev]'

      - name: Validate collector and history contracts
        run: python -m pytest

      - name: Backfill official raw data and daily snapshots
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/backfill_history.py \
            --start "${{ inputs.start_date }}" \
            --end "${{ inputs.end_date }}"

      - name: Preserve backfill evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0, Node 24
        with:
          name: history-backfill-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: reports/backfill/latest-summary.json
