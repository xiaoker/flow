name: Daily market data (compatibility)

on:
  # This file keeps the old manual Actions URL working while the heavy work
  # lives in market-data-collect.yml. It deliberately has no schedule and no
  # checkout/dependency installation.
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional three YYYY-MM-DD dates separated by spaces"
        required: false
        type: string
      collection_window:
        description: "Release window used for collection audit and reconciliation"
        required: false
        default: "auto"
        type: choice
        options: [auto, evening, morning, reconcile]
      run_key:
        description: "Stable pipeline run key"
        required: false
        default: ""
        type: string
      window_name:
        description: "Stable scheduler window name"
        required: false
        default: ""
        type: string
      target_date:
        description: "Shanghai business date associated with the window"
        required: false
        default: ""
        type: string
      lease_owner:
        description: "Pipeline-window lease owner"
        required: false
        default: ""
        type: string
      contract_version:
        description: "Pipeline run-key contract version"
        required: false
        default: "v1"
        type: string
      run_pcf_shadow:
        description: "Opt in to one legacy/v2 PCF parity run"
        required: false
        default: false
        type: boolean
      delegate_publish:
        description: "Dispatch the resumable publish stage after collection"
        required: false
        default: true
        type: boolean

permissions:
  actions: write
  contents: read

jobs:
  dispatch-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Dispatch market-data collect workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "main" \
            --arg dates "${{ inputs.dates }}" \
            --arg window "${{ inputs.collection_window || 'auto' }}" \
            --arg runKey "${{ inputs.run_key }}" \
            --arg windowName "${{ inputs.window_name }}" \
            --arg targetDate "${{ inputs.target_date }}" \
            --arg leaseOwner "${{ inputs.lease_owner }}" \
            --arg contractVersion "${{ inputs.contract_version || 'v1' }}" \
            --arg runPcfShadow "${{ inputs.run_pcf_shadow == true && 'true' || 'false' }}" \
            --arg delegatePublish "${{ inputs.delegate_publish != false && 'true' || 'false' }}" \
            '{ref:$ref,inputs:{dates:$dates,collection_window:$window,run_key:$runKey,window_name:$windowName,target_date:$targetDate,lease_owner:$leaseOwner,contract_version:$contractVersion,run_pcf_shadow:$runPcfShadow,delegate_publish:$delegatePublish}}' \
            > dispatch-request.json
          STATUS_CODE="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data-binary @dispatch-request.json \
            --output dispatch-response.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/xiaoker/flow/actions/workflows/market-data-collect.yml/dispatches")"
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "204" ]]; then
            echo "market-data-collect dispatch failed with HTTP $STATUS_CODE" >&2
            jq . dispatch-response.json >&2 || true
            exit 1
          fi
          if [[ "$STATUS_CODE" == "200" ]] && ! jq -e '.workflow_run_id != null' dispatch-response.json >/dev/null; then
            echo "market-data-collect dispatch returned HTTP 200 without a workflow_run_id." >&2
            jq . dispatch-response.json >&2 || true
            exit 1
          fi
          echo "Dispatched market-data-collect.yml."
