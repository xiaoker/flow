name: Daily market data

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional three YYYY-MM-DD dates separated by spaces"
        required: false
        type: string
  schedule:
    - cron: "10 16 * * 1-5"

permissions:
  contents: read

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_DATES: ${{ inputs.dates }}
      PUBLISH_URL: https://flow.xiaoker.com/api/v1/admin/import
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -e .

      - name: Resolve trading dates
        id: dates
        shell: bash
        run: |
          if [[ -n "$INPUT_DATES" ]]; then
            DATES="$INPUT_DATES"
          else
            DATES="$(python scripts/select_recent_trading_dates.py --count 3)"
          fi
          if [[ ! "$DATES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Expected exactly three ISO dates, got: $DATES" >&2
            exit 1
          fi
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "latest=${DATES##* }" >> "$GITHUB_OUTPUT"

      - name: Collect and validate official data
        shell: bash
        run: |
          read -r -a DATES <<< "${{ steps.dates.outputs.dates }}"
          trading-desk collect-phase0 \
            --dates "${DATES[@]}" \
            --szse-etf-inferred-date "${{ steps.dates.outputs.latest }}"

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard_snapshot.py --output dashboard-snapshot.json

      - name: Enforce publication quality gate
        shell: bash
        run: |
          if ! jq -e '.counts.fail == 0 and .phase0_gate_status != "blocked"' \
            reports/phase0/latest-quality-summary.json >/dev/null; then
            echo "Quality gate blocked publication; keeping the previous active snapshot." >&2
            jq '{counts, phase0_gate_status, errors}' reports/phase0/latest-quality-summary.json >&2
            exit 1
          fi

      - name: Publish snapshot to D1 and R2
        env:
          INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$INGEST_API_KEY" || -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
            exit 1
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @dashboard-snapshot.json \
            "$PUBLISH_URL"

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dashboard-snapshot.json
            reports/phase0/latest-manifest.json
            reports/phase0/latest-quality-summary.json
