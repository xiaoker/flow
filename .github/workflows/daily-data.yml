name: Daily market data

on:
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional three YYYY-MM-DD dates separated by spaces"
        required: false
        type: string

# Cloudflare Cron dispatches this workflow at 18:15, 23:15, 09:30 and 10:30
# Asia/Shanghai on trading weekdays. Early runs preserve whichever official
# sources are already available; only a complete same-trading-day snapshot is
# allowed to replace the active dashboard.

permissions:
  contents: read

concurrency:
  group: daily-market-data
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      INPUT_DATES: ${{ inputs.dates }}
      PUBLISH_URL: https://flow.xiaoker.com/api/v1/admin/import
      FLOW_SOURCE_PROXY_URL: https://flow.xiaoker.com/api/v1/admin/source-proxy
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -e '.[dev]'

      - name: Test source mappings and quality gates
        run: python -m pytest

      - name: Resolve trading dates
        id: dates
        shell: bash
        run: |
          if [[ -n "$INPUT_DATES" ]]; then
            DATES="$INPUT_DATES"
          else
            DATES="$(python scripts/select_recent_trading_dates.py --count 3)"
          fi
          if [[ ! "$DATES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Expected exactly three ISO dates, got: $DATES" >&2
            exit 1
          fi
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "latest=${DATES##* }" >> "$GITHUB_OUTPUT"

      - name: Collect and validate official data
        shell: bash
        run: |
          read -r -a DATES <<< "${{ steps.dates.outputs.dates }}"
          MAX_ATTEMPTS=3
          for (( attempt=1; attempt<=MAX_ATTEMPTS; attempt++ )); do
            trading-desk collect-phase0 \
              --dates "${DATES[@]}"
            if jq -e '.counts.fail == 0 and .phase0_gate_status != "blocked"' \
              reports/phase0/latest-quality-summary.json >/dev/null; then
              break
            fi
            if [[ "$attempt" -eq "$MAX_ATTEMPTS" ]] || \
              ! jq -e '.errors | length > 0 and all(.[]; .error_type == "ConnectionError" or .error_type == "HTTPError")' \
                reports/phase0/latest-quality-summary.json >/dev/null; then
              break
            fi
            echo "Transient official-source failure; retrying collection attempt $((attempt + 1))/$MAX_ATTEMPTS." >&2
            sleep $((attempt * 30))
          done

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard_snapshot.py --output dashboard-snapshot.json

      - name: Reconcile evidence, mappings and dashboard values
        shell: bash
        run: |
          if jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null; then
            trading-desk qa-release --snapshot dashboard-snapshot.json
          else
            echo "Snapshot is pending source confirmation; raw data will be archived and the active dashboard remains unchanged."
            jq '.publication' dashboard-snapshot.json
          fi

      - name: Build verified archive and publish bundle
        run: python scripts/build_ingest_bundle.py --output ingest-bundle.json

      - name: Build full-source history archive bundle
        run: python scripts/build_history_bundle.py --output history-bundle.json

      - name: Archive all official raw and normalized sources
        env:
          INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @history-bundle.json \
            "https://flow.xiaoker.com/api/v1/admin/history-import"

      - name: Archive raw evidence and publish normalized data
        env:
          INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$INGEST_API_KEY" || -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
            exit 1
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @ingest-bundle.json \
            "$PUBLISH_URL"

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-data-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dashboard-snapshot.json
            reports/phase0/latest-manifest.json
            reports/phase0/latest-quality-summary.json
            reports/phase0/latest-release-qa.json
            reports/backfill/latest-summary.json
            history-bundle.json
