name: PCF v2 checkpoint capture

on:
  # PCF is an independent, resumable control-plane operation. It reads D1
  # checkpoints and never invokes the market-data collect or publish jobs.
  workflow_dispatch:
    inputs:
      dates:
        description: "Trading dates to reconcile, one or more ISO dates separated by spaces"
        required: true
        type: string
      required_days:
        description: "Minimum consecutive observations for the shadow gate"
        required: false
        default: "5"
        type: string

permissions:
  contents: read

concurrency:
  group: pcf-v2-capture
  cancel-in-progress: false

jobs:
  checkpoint-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install checkpoint tools
        run: python -m pip install -e '.[dev]'

      - name: Validate checkpoint dates
        shell: bash
        env:
          INPUT_DATES: ${{ inputs.dates }}
          INPUT_REQUIRED_DAYS: ${{ inputs.required_days || '5' }}
        run: |
          set -euo pipefail
          : > pcf-dates.txt
          for value in $INPUT_DATES; do
            if [[ ! "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Invalid PCF checkpoint date: $value" >&2
              exit 1
            fi
            echo "$value" >> pcf-dates.txt
          done
          sort -u pcf-dates.txt -o pcf-dates.txt
          count="$(wc -l < pcf-dates.txt | tr -d ' ')"
          if [[ "$count" -lt "$INPUT_REQUIRED_DAYS" ]]; then
            echo "Only $count checkpoint dates supplied; required_days=$INPUT_REQUIRED_DAYS." >&2
            exit 1
          fi

      - name: Build independent exact-date PCF v2 plan
        id: pcf_plan
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/pcf-v2
          python -m scripts.build_pcf_v2_plan \
            --official-live \
            --evidence-dir reports/pcf-v2 \
            --output reports/pcf-v2/automatic-plan.json
          jq '{targetDate,previousDate,status,counts,planSha256}' \
            reports/pcf-v2/automatic-plan.json >> "$GITHUB_STEP_SUMMARY"

      - name: Capture exact PCF v2 items with D1 checkpoints
        if: ${{ steps.pcf_plan.outcome == 'success' }}
        id: pcf_capture
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="$(jq -r '.targetDate' reports/pcf-v2/automatic-plan.json)"
          set +e
          python -m scripts.capture_sse_pcf_v2 \
            --plan reports/pcf-v2/automatic-plan.json \
            --output "reports/pcf-v2/${TARGET_DATE}-capture.json"
          EXIT_CODE=$?
          set -e
          jq '{targetDate,jobId,required,captured,skipped,failed,status,failures}' \
            "reports/pcf-v2/${TARGET_DATE}-capture.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

      - name: Finalize independent PCF v2 canonical checkpoint
        if: ${{ always() && steps.pcf_plan.outcome == 'success' }}
        id: pcf_finalize
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          TARGET_DATE="$(jq -r '.targetDate' reports/pcf-v2/automatic-plan.json)"
          set +e
          python -m scripts.finalize_sse_pcf_v2 \
            --plan reports/pcf-v2/automatic-plan.json \
            --output "reports/pcf-v2/${TARGET_DATE}-finalize.json"
          EXIT_CODE=$?
          set -e
          jq '{status,tradeDate,previousDate,jobId,revisionId,coverage,budget,productionPublishCalls}' \
            "reports/pcf-v2/${TARGET_DATE}-finalize.json" >> "$GITHUB_STEP_SUMMARY"
          exit "$EXIT_CODE"

      - name: Read D1 PCF checkpoints and build shadow summary
        shell: bash
        env:
          INPUT_REQUIRED_DAYS: ${{ inputs.required_days || '5' }}
        run: |
          set -euo pipefail
          python -m scripts.summarize_pcf_v2_history \
            --base-url "$FLOW_PUBLIC_URL" \
            --dates pcf-dates.txt \
            --required-days "$INPUT_REQUIRED_DAYS" \
            --output reports/pcf-v2/checkpoint-summary.json
          jq '{status,requiredDays,observedDays,passingDays,dates,failedDates,guardrails}' \
            reports/pcf-v2/checkpoint-summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Fail PCF workflow on unresolved checkpoint state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.pcf_plan.outcome }}" != "success" || \
                "${{ steps.pcf_capture.outcome }}" != "success" || \
                "${{ steps.pcf_finalize.outcome }}" != "success" ]]; then
            echo "PCF v2 plan, capture or finalize did not complete successfully; evidence is preserved for retry." >&2
            exit 1
          fi
          if [[ ! -s reports/pcf-v2/checkpoint-summary.json ]] || \
             [[ "$(jq -r '.status // ""' reports/pcf-v2/checkpoint-summary.json)" != "PASS" ]]; then
            echo "PCF v2 checkpoint summary is not passing; penetration capability remains unchanged." >&2
            exit 1
          fi

      - name: Record PCF resource budget
        if: always()
        shell: bash
        env:
          INPUT_RUN_KEY: "pcf-v2:${{ inputs.dates }}"
        run: |
          mkdir -p reports/budget
          python scripts/report_stage_budget.py \
            --stage pcfExact \
            --run-key "$INPUT_RUN_KEY" \
            --actions-minutes 0 \
            --actions-run-attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --output reports/budget/pcf-exact.json

      - name: Preserve PCF checkpoint evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: pcf-v2-checkpoints-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            pcf-dates.txt
            reports/pcf-v2/**
            reports/pcf-v2/checkpoint-summary.json
            reports/budget/pcf-exact.json
