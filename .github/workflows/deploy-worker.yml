name: Deploy Flow Worker

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Web lint and production contract tests
        run: |
          npm run lint
          npm test

      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply flow --remote

      - name: Deploy Worker and static assets
        run: |
          npm run build
          npx wrangler deploy \
            --keep-vars \
            --var "FLOW_BUILD_SHA:${GITHUB_SHA}" \
            --var "FLOW_DEPLOYED_AT:$(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Verify production build identity
        working-directory: .
        run: |
          for attempt in 1 2 3; do
            headers="$(mktemp)"
            if curl --silent --show-error --fail --retry 2 --retry-all-errors \
              --dump-header "$headers" --output /dev/null https://flow.xiaoker.com/ \
              && grep -qiE "^x-flow-build-sha:[[:space:]]*${GITHUB_SHA}[[:space:]]*$" "$headers"; then
              rm -f "$headers"
              echo "Production Worker build SHA verified: $GITHUB_SHA"
              exit 0
            fi
            rm -f "$headers"
            sleep 3
          done
          echo "Production Worker did not expose the deployed build SHA $GITHUB_SHA" >&2
          exit 1
