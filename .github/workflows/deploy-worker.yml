name: Deploy Flow Worker

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flow-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0, Node 24
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Web lint and production contract tests
        run: |
          npm run lint
          npm test

      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID" >&2; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN" >&2; exit 1; }

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply flow --remote

      - name: Set build metadata
        run: |
          echo "FLOW_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "FLOW_DEPLOYED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Deploy Worker and static assets
        run: npm run deploy

      - name: Verify deployed build identity
        shell: bash
        run: |
          test -n "$FLOW_CF_ACCESS_CLIENT_ID" || { echo "Missing FLOW_CF_ACCESS_CLIENT_ID" >&2; exit 1; }
          test -n "$FLOW_CF_ACCESS_CLIENT_SECRET" || { echo "Missing FLOW_CF_ACCESS_CLIENT_SECRET" >&2; exit 1; }
          headers_file="$(mktemp)"
          body_file="$(mktemp)"
          verified=0
          for attempt in $(seq 1 20); do
            : > "$headers_file"
            : > "$body_file"
            status="$(curl --silent --show-error --retry 2 --retry-all-errors \
              --header "Cache-Control: no-cache" \
              --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
              --dump-header "$headers_file" --output "$body_file" --write-out '%{http_code}' \
              "$FLOW_PUBLIC_URL/api/v2/releases/latest?build_check=$GITHUB_SHA&attempt=$attempt")"
            if [ "$status" = "200" ] \
              && grep -Fqi "x-flow-build-sha: $GITHUB_SHA" "$headers_file" \
              && jq -e --arg sha "$GITHUB_SHA" \
                '.buildSha == $sha and (.releaseId | type == "string") and (.asOf | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
                "$body_file" >/dev/null; then
              verified=1
              echo "Verified deployed Worker build identity on attempt $attempt."
              break
            fi
            if [ "$attempt" -lt 20 ]; then sleep 2; fi
          done
          if [ "$verified" -ne 1 ]; then
            echo "Deployed Worker did not expose build SHA $GITHUB_SHA within the rollout window." >&2
            grep -FiE '^(HTTP/|x-flow-build-sha:|x-flow-deployed-at:|x-flow-release-id:|cache-control:)' "$headers_file" >&2 || true
            jq -c '{buildSha, releaseId, asOf}' "$body_file" >&2 || true
            exit 1
          fi
