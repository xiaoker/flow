name: Cloudflare Access smoke

on:
  workflow_dispatch:
    inputs:
      recovery_run_key:
        description: Optional single runKey for GET-only lease and budget diagnostics
        type: string
        default: ""
      auth_diagnostic_only:
        description: Two read-only status probes (curl and Python); no source request
        type: boolean
        default: false
  schedule:
    # Weekly independent check that Cloudflare Access and the SSE fallback
    # transport are healthy before a business-morning collection.
    - cron: "30 0 * * 1"

permissions:
  contents: read

concurrency:
  group: cloudflare-access-smoke
  cancel-in-progress: true

jobs:
  verify-private-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STATUS_URL: https://flow.xiaoker.com/api/v1/data-status
      SOURCE_PROXY_URL: https://flow.xiaoker.com/api/v1/admin/source-proxy
      INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      DIAGNOSTIC_RUN_KEY: ${{ inputs.recovery_run_key || '' }}
    steps:
      - name: Verify service identity secrets are configured
        shell: bash
        run: |
          if [[ -z "$INGEST_API_KEY" || -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
            exit 1
          fi

      - name: Checkout bounded diagnostic
        if: ${{ inputs.recovery_run_key != '' }}
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8

      - name: Observe one recovery admission
        if: ${{ inputs.recovery_run_key != '' }}
        run: python3 scripts/diagnose_recovery_admission.py

      - name: Request the private data status endpoint
        if: ${{ inputs.auth_diagnostic_only != true && inputs.recovery_run_key == '' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --output access-response.json \
            "$STATUS_URL"

      - name: Validate the response contract
        if: ${{ inputs.auth_diagnostic_only != true && inputs.recovery_run_key == '' }}
        shell: bash
        run: |
          jq -e '
            (.asOf | type == "string") and
            (.gate | type == "string") and
            (.quality | type == "object") and
            (.domains | type == "array")
          ' access-response.json >/dev/null
          echo "Cloudflare Access service identity and private read endpoint are healthy."

      - name: Request an allowlisted SSE source through Cloudflare
        if: ${{ inputs.auth_diagnostic_only != true && inputs.recovery_run_key == '' }}
        shell: bash
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
            --get \
            --header "Authorization: Bearer $INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --data-urlencode "path=/commonQuery.do" \
            --data-urlencode "isPagination=true" \
            --data-urlencode "pageHelp.pageSize=1" \
            --data-urlencode "pageHelp.pageNo=1" \
            --data-urlencode "pageHelp.beginPage=1" \
            --data-urlencode "pageHelp.cacheSize=1" \
            --data-urlencode "pageHelp.endPage=1" \
            --data-urlencode "sqlId=COMMON_SSE_ZQPZ_ETFZL_XXPL_ETFGM_SEARCH_L" \
            --data-urlencode "STAT_DATE=2026-07-27" \
            --output source-proxy-response.json \
            "$SOURCE_PROXY_URL"
          jq -e '.result | type == "array" and length > 0' \
            source-proxy-response.json >/dev/null
          echo "Authenticated, allowlisted SSE fallback transport is healthy."

      - name: Compare read-only authenticated transports
        if: ${{ inputs.auth_diagnostic_only == true && inputs.recovery_run_key == '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError

          # An absent key is intentional: authenticated 404 proves route access,
          # without reading an existing task or performing a lease write.
          url = "https://flow.xiaoker.com/api/v1/admin/pipeline-window/status?runKey=daily-market-data:2000-01-01:evening:v1"
          headers = {"Authorization": "Bearer " + os.environ["INGEST_API_KEY"],
                     "CF-Access-Client-Id": os.environ["CF_ACCESS_CLIENT_ID"],
                     "CF-Access-Client-Secret": os.environ["CF_ACCESS_CLIENT_SECRET"],
                     "Content-Type": "application/json"}
          for value in headers.values():
              if any(c in value for c in '\r\n'):
                  raise SystemExit("invalid credential format")
          def safe(status, raw):
              result = {"status": status}
              for key, pattern in (("cf-ray", r"[a-fA-F0-9]{16,32}-[A-Z]{3}"),
                                   ("content-type", r"(?:application/json|text/html)(?:;\s*charset=[A-Za-z0-9-]+)?"),
                                   ("cf-mitigated", r"challenge")):
                  value = raw.get(key, "").strip()
                  if re.fullmatch(pattern, value, re.I):
                      result[key] = value
              return result
          # Credentials enter curl through stdin, never argv; no redirect/retry.
          config = ''.join('header = ' + json.dumps(k + ': ' + v) + '\n' for k,v in headers.items())
          curl = subprocess.run(["curl", "--config", "-", "--silent", "--max-time", "20",
                                 "--dump-header", "-", "--output", "/dev/null", url],
                                input=config, text=True, capture_output=True, timeout=25)
          lines = curl.stdout.splitlines()
          status = int(lines[0].split()[1]) if lines and re.match(r'HTTP/\S+ \d{3}', lines[0]) else 0
          fields = {k.lower():v.strip() for line in lines if ':' in line for k,v in [line.split(':',1)]}
          results = {"curl": safe(status, fields), "curlExitCode": curl.returncode}
          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, hdrs, newurl):
                  return None
          try:
              response = build_opener(NoRedirect()).open(Request(url, headers=headers, method="GET"), timeout=20)
          except HTTPError as error:
              response = error
          except Exception:
              response = None
          if response is None:
              results["python"] = {"status": 0}
          else:
              results["python"] = safe(response.code, {k.lower():v for k,v in response.headers.items()})
              response.close()
          print(json.dumps(results, sort_keys=True))
          if curl.returncode or any(results[k]["status"] != 404 for k in ("curl", "python")):
              raise SystemExit("authenticated read-only transport comparison failed")
          PY
