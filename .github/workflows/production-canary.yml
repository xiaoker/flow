name: Production release canary

on:
  # A 100-round read canary is intentionally independent from daily
  # collection.  Keeping it out of the release-window job prevents a healthy
  # data publish from being held hostage by a long read-only smoke test and
  # keeps the daily Worker request budget predictable.
  schedule:
    - cron: "30 2 * * 1" # 10:30 Asia/Shanghai every Monday
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-release-canary
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"

      - name: Install canary verifier
        run: python -m pip install --disable-pip-version-check -q requests

      - name: Resolve active release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          latest="$(curl --fail --silent --show-error --location \
            -H "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            -H "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            "$FLOW_PUBLIC_URL/api/v2/releases/latest")"
          release_id="$(jq -r '.releaseId // empty' <<<"$latest")"
          as_of="$(jq -r '.asOf // empty' <<<"$latest")"
          build_sha="$(jq -r '.buildSha // empty' <<<"$latest")"
          [[ "$release_id" =~ ^release: ]] || { echo "active release is unavailable" >&2; exit 1; }
          [[ "$as_of" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "active release has no valid asOf" >&2; exit 1; }
          [[ "$build_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "active release has no build SHA" >&2; exit 1; }
          {
            echo "release_id=$release_id"
            echo "as_of=$as_of"
            echo "build_sha=$build_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Verify 100-round dashboard production read canary
        # The dashboard slot is the required core release.  The optional
        # ETF-penetration slot remains disabled until its own PCF v2 gate has
        # passed, so the generic full-slot check would correctly receive 503
        # and incorrectly fail this core canary.
        run: |
          python scripts/verify_published_release.py \
            --release-id "${{ steps.release.outputs.release_id }}" \
            --as-of "${{ steps.release.outputs.as_of }}" \
            --build-sha "${{ steps.release.outputs.build_sha }}" \
            --slot dashboard \
            --repeat 100 > release-canary.json
          cat release-canary.json

      - name: Preserve canary evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v6.0.0, Node 24
        with:
          name: production-canary-${{ github.run_id }}
          path: release-canary.json
          if-no-files-found: warn
