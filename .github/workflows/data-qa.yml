name: Data QA

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-and-contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Test source mappings and quality gates
        run: python -m pytest
