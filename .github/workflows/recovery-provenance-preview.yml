name: Recovery provenance preview (read-only)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Fixed provenance scope start"
        required: true
        default: "2024-08-01"
        type: string
      end_date:
        description: "Fixed provenance scope end"
        required: true
        default: "2026-09-03"
        type: string
      page_limit:
        description: "Bounded API page size (must remain 4)"
        required: true
        default: "4"
        type: string

permissions:
  contents: read

concurrency:
  group: recovery-provenance-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Export bounded provenance evidence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLOW_PUBLIC_URL: ${{ vars.FLOW_PUBLIC_URL }}
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      PAGE_LIMIT: ${{ inputs.page_limit }}
    steps:
      - name: Checkout read-only preview
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: Preflight fixed scope and read-only credentials
        run: |
          set -euo pipefail
          if [ "$START_DATE" != "2024-08-01" ] || [ "$END_DATE" != "2026-09-03" ]; then
            echo "fixed provenance scope is required" >&2
            exit 2
          fi
          if [ "$PAGE_LIMIT" != "4" ]; then
            echo "page_limit must remain 4" >&2
            exit 2
          fi
          case "${FLOW_PUBLIC_URL:-}" in
            https://*) ;;
            *) echo "FLOW_PUBLIC_URL must be an HTTPS origin" >&2; exit 2 ;;
          esac
          if [ -z "${FLOW_INGEST_API_KEY:-}" ]; then
            echo "FLOW_INGEST_API_KEY is required" >&2
            exit 2
          fi
          if [ -n "${FLOW_CF_ACCESS_CLIENT_ID:-}" ] && [ -z "${FLOW_CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "Cloudflare Access credentials must be supplied as a pair" >&2
            exit 2
          fi
          if [ -z "${FLOW_CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${FLOW_CF_ACCESS_CLIENT_SECRET:-}" ]; then
            echo "Cloudflare Access credentials must be supplied as a pair" >&2
            exit 2
          fi

      - name: Run bounded GET-only provenance preview
        env:
          PREVIEW_DIR: ${{ runner.temp }}/recovery-provenance-preview
        run: |
          set -euo pipefail
          mkdir -p "$PREVIEW_DIR"
          PYTHONPATH=src:. python scripts/preview_recovery_provenance.py \
            --base-url "$FLOW_PUBLIC_URL" \
            --start "$START_DATE" \
            --end "$END_DATE" \
            --limit "$PAGE_LIMIT" \
            --output-dir "$PREVIEW_DIR"

      - name: Assert preview remains blocked and mutation-free
        if: ${{ success() }}
        env:
          PREVIEW_DIR: ${{ runner.temp }}/recovery-provenance-preview
        run: |
          set -euo pipefail
          jq -e '
            (.executionBlocked == true) and
            (.planStatus == "NOT_APPROVED") and
            (.reconciliationStatus == "PENDING") and
            (.safety.httpMethods == ["GET"]) and
            (.safety.r2Writes == 0) and
            (.safety.workflowDispatches == 0) and
            (.safety.activePointerChanges == 0)
          ' "$PREVIEW_DIR/provenance-preview.json" >/dev/null

      - name: Remove sensitive environment
        if: ${{ always() }}
        run: unset FLOW_INGEST_API_KEY FLOW_CF_ACCESS_CLIENT_SECRET

      - name: Upload bounded preview evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: recovery-provenance-preview-${{ github.run_id }}
          path: ${{ runner.temp }}/recovery-provenance-preview
          if-no-files-found: warn
          retention-days: 7
