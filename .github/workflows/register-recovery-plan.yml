name: Register recovery plan (manual, immutable)

on:
  workflow_dispatch:
    inputs:
      plan_base64:
        description: "Exact approved recovery plan bytes encoded as one-line base64"
        required: true
        type: string
      confirm_plan_hash:
        description: "Exact approved semantic planHash"
        required: true
        type: string
      expected_attempt_count:
        description: "Approved pipeline_window attempt_count"
        required: true
        type: string
      expected_updated_at:
        description: "Approved pipeline_window updated_at"
        required: true
        type: string
      previous_state_base64:
        description: "Approved previous pipeline state JSON encoded as one-line base64"
        required: true
        type: string
      reason_code:
        description: "Audited recovery reason code"
        required: true
        default: "controlled_recovery"
        type: string
      approval_reference:
        description: "Immutable reference to the explicit operator approval"
        required: true
        type: string
      authorized_at:
        description: "Approval timestamp in UTC ISO-8601 format"
        required: true
        type: string
      expires_at:
        description: "Authorization expiry in UTC ISO-8601 format"
        required: true
        type: string
      supersedes_recovery_id:
        description: "Optional expired PAUSED recovery generation to replace atomically"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: register-recovery-plan
  cancel-in-progress: false

jobs:
  register:
    name: Store and register one approved plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      PLAN_BASE64: ${{ inputs.plan_base64 }}
      CONFIRM_PLAN_HASH: ${{ inputs.confirm_plan_hash }}
      EXPECTED_ATTEMPT_COUNT: ${{ inputs.expected_attempt_count }}
      EXPECTED_UPDATED_AT: ${{ inputs.expected_updated_at }}
      PREVIOUS_STATE_BASE64: ${{ inputs.previous_state_base64 }}
      REASON_CODE: ${{ inputs.reason_code }}
      APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
      AUTHORIZED_AT: ${{ inputs.authorized_at }}
      EXPIRES_AT: ${{ inputs.expires_at }}
      SUPERSEDES_RECOVERY_ID: ${{ inputs.supersedes_recovery_id }}
    steps:
      - name: Validate immutable plan and approval inputs
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets are required." >&2
            exit 2
          fi
          if [[ ! "$CONFIRM_PLAN_HASH" =~ ^[0-9a-f]{64}$ ]]; then
            echo "confirm_plan_hash must be a lowercase SHA-256 digest." >&2
            exit 2
          fi
          if [[ ! "$EXPECTED_ATTEMPT_COUNT" =~ ^[0-9]+$ ]]; then
            echo "expected_attempt_count must be a non-negative integer." >&2
            exit 2
          fi
          if [[ -n "$SUPERSEDES_RECOVERY_ID" && ! "$SUPERSEDES_RECOVERY_ID" =~ ^[A-Za-z0-9:_./-]{1,200}$ ]]; then
            echo "supersedes_recovery_id is invalid." >&2
            exit 2
          fi

          umask 077
          WORK_DIR="$RUNNER_TEMP/recovery-plan-registration"
          mkdir -p "$WORK_DIR"
          PLAN_FILE="$WORK_DIR/plan.json"
          PREVIOUS_STATE_FILE="$WORK_DIR/previous-state.json"
          printf '%s' "$PLAN_BASE64" | base64 --decode > "$PLAN_FILE"
          printf '%s' "$PREVIOUS_STATE_BASE64" | base64 --decode > "$PREVIOUS_STATE_FILE"
          test -s "$PLAN_FILE"
          test "$(wc -c < "$PLAN_FILE")" -le 300000
          jq -e 'type == "object"' "$PREVIOUS_STATE_FILE" >/dev/null

          RECOVERY_ID="$(jq -er '.recoveryId | select(type == "string" and length > 0)' "$PLAN_FILE")"
          RUN_KEY="$(jq -er '.runKey | select(type == "string" and length > 0)' "$PLAN_FILE")"
          PLAN_HASH="$(jq -er '.planHash | select(type == "string")' "$PLAN_FILE")"
          SCOPE_SHA256="$(sha256sum "$PLAN_FILE" | awk '{print $1}')"
          SEMANTIC_SHA256="$(python3 -c 'import hashlib,json,sys; p=json.load(open(sys.argv[1], encoding="utf-8")); p.pop("planHash", None); b=json.dumps(p, ensure_ascii=False, sort_keys=True, separators=(",", ":")).encode(); print(hashlib.sha256(b).hexdigest())' "$PLAN_FILE")"

          if [[ "$PLAN_HASH" != "$CONFIRM_PLAN_HASH" || "$SEMANTIC_SHA256" != "$CONFIRM_PLAN_HASH" ]]; then
            echo "Approved planHash does not match the exact plan semantics." >&2
            exit 2
          fi
          if [[ ! "$RUN_KEY" =~ ^daily-market-data:[0-9]{4}-[0-9]{2}-[0-9]{2}:[a-z_]+:v[0-9]+$ ]]; then
            echo "Plan runKey is invalid." >&2
            exit 2
          fi

          PAYLOAD_FILE="$WORK_DIR/register.json"
          jq -n \
            --arg recoveryId "$RECOVERY_ID" \
            --arg runKey "$RUN_KEY" \
            --arg planSha256 "$PLAN_HASH" \
            --arg scopeSha256 "$SCOPE_SHA256" \
            --rawfile planJson "$PLAN_FILE" \
            --argjson expectedAttemptCount "$EXPECTED_ATTEMPT_COUNT" \
            --arg expectedUpdatedAt "$EXPECTED_UPDATED_AT" \
            --rawfile previousStateJson "$PREVIOUS_STATE_FILE" \
            --arg reasonCode "$REASON_CODE" \
            --arg approvalReference "$APPROVAL_REFERENCE" \
            --arg authorizedAt "$AUTHORIZED_AT" \
            --arg expiresAt "$EXPIRES_AT" \
            --arg supersedesRecoveryId "$SUPERSEDES_RECOVERY_ID" \
            '{recoveryId:$recoveryId, runKey:$runKey, planSha256:$planSha256, scopeSha256:$scopeSha256, planJson:$planJson, expectedAttemptCount:$expectedAttemptCount, expectedUpdatedAt:$expectedUpdatedAt, previousStateJson:$previousStateJson, reasonCode:$reasonCode, approvalReference:$approvalReference, authorizedAt:$authorizedAt, expiresAt:$expiresAt} | if $supersedesRecoveryId == "" then . else . + {supersedesRecoveryId:$supersedesRecoveryId} end' \
            > "$PAYLOAD_FILE"

          {
            echo "work_dir=$WORK_DIR"
            echo "recovery_id=$RECOVERY_ID"
            echo "run_key=$RUN_KEY"
            echo "plan_hash=$PLAN_HASH"
            echo "scope_sha256=$SCOPE_SHA256"
          } >> "$GITHUB_OUTPUT"

      - name: Register plan through the audited control plane
        id: register
        shell: bash
        env:
          WORK_DIR: ${{ steps.validate.outputs.work_dir }}
        run: |
          set -euo pipefail
          AUTH_ARGS=(
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
          )
          HTTP_CODE="$(curl --silent --show-error \
            --output "$WORK_DIR/register-response.json" \
            --write-out '%{http_code}' \
            --request POST \
            "${AUTH_ARGS[@]}" \
            --header 'Content-Type: application/json' \
            --data-binary "@$WORK_DIR/register.json" \
            "$FLOW_PUBLIC_URL/api/v1/admin/pipeline-window/recovery")"
          if [[ "$HTTP_CODE" != "200" && "$HTTP_CODE" != "201" ]]; then
            jq -c '{error, detail}' "$WORK_DIR/register-response.json" >&2 || true
            echo "Recovery registration failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          jq -e \
            --arg recoveryId "${{ steps.validate.outputs.recovery_id }}" \
            --arg runKey "${{ steps.validate.outputs.run_key }}" \
            '.recoveryId == $recoveryId and .runKey == $runKey and (.decision == "registered" or .decision == "already_registered" or .decision == "superseded") and (.planStorageDecision == "stored" or .planStorageDecision == "already_stored")' \
            "$WORK_DIR/register-response.json" >/dev/null

      - name: Verify registered plan is readable and hash-bound
        shell: bash
        env:
          WORK_DIR: ${{ steps.validate.outputs.work_dir }}
          RECOVERY_ID: ${{ steps.validate.outputs.recovery_id }}
          PLAN_HASH: ${{ steps.validate.outputs.plan_hash }}
          SCOPE_SHA256: ${{ steps.validate.outputs.scope_sha256 }}
        run: |
          set -euo pipefail
          AUTH_ARGS=(
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
          )
          ENCODED_ID="$(jq -rn --arg value "$RECOVERY_ID" '$value | @uri')"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$WORK_DIR/verify-response.json" \
            --write-out '%{http_code}' \
            "${AUTH_ARGS[@]}" \
            "$FLOW_PUBLIC_URL/api/v1/admin/pipeline-window/recovery/plan?recoveryId=$ENCODED_ID")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            jq -c '{error, detail}' "$WORK_DIR/verify-response.json" >&2 || true
            echo "Registered plan verification failed with HTTP $HTTP_CODE." >&2
            exit 1
          fi
          jq -e \
            --arg recoveryId "$RECOVERY_ID" \
            --arg planHash "$PLAN_HASH" \
            --arg scopeSha256 "$SCOPE_SHA256" \
            '.recoveryId == $recoveryId and .planSha256 == $planHash and .scopeSha256 == $scopeSha256 and .plan.planHash == $planHash' \
            "$WORK_DIR/verify-response.json" >/dev/null
          {
            echo "### Recovery plan registration"
            echo "- recoveryId: \`$RECOVERY_ID\`"
            echo "- planHash: \`$PLAN_HASH\`"
            echo "- scopeSha256: \`$SCOPE_SHA256\`"
            echo "- result: immutable plan stored, D1 authorization registered, read-back verified"
            echo "- collector/publisher dispatch: not performed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary registration payloads
        if: ${{ always() }}
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/recovery-plan-registration"
          unset FLOW_INGEST_API_KEY FLOW_CF_ACCESS_CLIENT_SECRET PLAN_BASE64 PREVIOUS_STATE_BASE64
