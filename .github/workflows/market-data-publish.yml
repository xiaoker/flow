name: Market data publish

on:
  # Publishing is a separate, resumable dispatch.  It consumes the immutable
  # source artifact produced by market-data-collect.yml and never recollects
  # official sources.
  workflow_dispatch:
    inputs:
      run_key:
        description: "Stable pipeline run key"
        required: true
        type: string
      window_name:
        description: "Stable scheduler window name"
        required: true
        type: string
      target_date:
        description: "Resolved source snapshot date (must equal snapshot.asOf)"
        required: true
        type: string
      lease_owner:
        description: "Pipeline-window lease owner"
        required: true
        type: string
      recovery_id:
        description: "Approved recovery authorization id (optional)"
        required: false
        default: ""
        type: string
      recovery_attempt_count:
        description: "Attempt count returned by the recovery claim"
        required: false
        default: ""
        type: string
      recovery_plan_sha256:
        description: "Expected immutable recovery plan hash"
        required: false
        default: ""
        type: string
      recovery_data_date:
        description: "One approved recovery data date; recovery is date-major"
        required: false
        default: ""
        type: string
      recovery_stage:
        description: "One approved recovery stage"
        required: false
        default: "publish"
        type: string
      contract_version:
        description: "Pipeline run-key contract version"
        required: false
        default: "v1"
        type: string
      source_run_id:
        description: "Collection workflow run that uploaded the source artifact"
        required: true
        type: string
      artifact_name:
        description: "Immutable collection artifact to download"
        required: true
        type: string
      gate_enabled:
        description: "Whether pipeline_window status must be checked"
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: market-data-publish-${{ inputs.run_key || github.run_id }}
  cancel-in-progress: false

jobs:
  publish_window_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      gate_enabled: ${{ steps.gate.outputs.gate_enabled }}
    env:
      PIPELINE_WINDOW_GATE_ENABLED: ${{ inputs.gate_enabled || 'false' }}
      FLOW_PIPELINE_WINDOW_URL: https://flow.xiaoker.com/api/v1/admin/pipeline-window
      PIPELINE_RECOVERY_ENABLED: ${{ vars.PIPELINE_RECOVERY_ENABLED || '0' }}
      INPUT_RECOVERY_ID: ${{ inputs.recovery_id || '' }}
      INPUT_RECOVERY_ATTEMPT_COUNT: ${{ inputs.recovery_attempt_count || '' }}
      INPUT_RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 || '' }}
      INPUT_RECOVERY_DATA_DATE: ${{ inputs.recovery_data_date || '' }}
      INPUT_RECOVERY_STAGE: ${{ inputs.recovery_stage || 'publish' }}
      INPUT_LEASE_OWNER: ${{ inputs.lease_owner }}
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - name: Verify publish lease before installing dependencies
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          RUN_KEY="${{ inputs.run_key }}"
          if [[ ! "$RUN_KEY" =~ ^daily-market-data:[0-9]{4}-[0-9]{2}-[0-9]{2}:[a-z_]+:v[0-9]+$ ]]; then
            echo "Invalid run_key input: $RUN_KEY" >&2
            exit 1
          fi
          if [[ -n "$INPUT_RECOVERY_ID" ]]; then
            if [[ "$PIPELINE_RECOVERY_ENABLED" != "1" && "$PIPELINE_RECOVERY_ENABLED" != "true" ]]; then
              echo "PIPELINE_RECOVERY_ENABLED is disabled; refusing recovery publish." >&2
              exit 1
            fi
            if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
              echo "Recovery publish gate requires FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets." >&2
              exit 1
            fi
            AUTH_ARGS=(
              --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
              --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
              --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
            )
            RECOVERY_ID="$INPUT_RECOVERY_ID"
            ENCODED_RECOVERY_ID="$(jq -rn --arg value "$RECOVERY_ID" '$value|@uri')"
            RECOVERY_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
              --output pipeline-recovery-status.json \
              --write-out '%{http_code}' \
              "$FLOW_PIPELINE_WINDOW_URL/recovery?recoveryId=$ENCODED_RECOVERY_ID")"
            if [[ "$RECOVERY_CODE" != "200" ]]; then
              echo "Recovery publish status failed with HTTP $RECOVERY_CODE; fail closed." >&2
              jq . pipeline-recovery-status.json >&2 || true
              exit 1
            fi
            if [[ "$(jq -r '.runKey // empty' pipeline-recovery-status.json)" != "$RUN_KEY" ]] || \
               [[ "$(jq -r '.status // empty' pipeline-recovery-status.json)" != "ACTIVE" ]]; then
              echo "Recovery authorization is not active for this publish run; refusing to build or activate." >&2
              jq '{recoveryId,runKey,status,pipeline}' pipeline-recovery-status.json >&2 || true
              exit 1
            fi
            if [[ -z "$INPUT_RECOVERY_ATTEMPT_COUNT" || ! "$INPUT_RECOVERY_ATTEMPT_COUNT" =~ ^[0-9]+$ ]]; then
              echo "Recovery publish input is missing a valid attempt generation; refusing to publish." >&2
              exit 1
            fi
            if [[ -z "$INPUT_RECOVERY_PLAN_SHA256" || ! "$INPUT_RECOVERY_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
              echo "recovery_plan_sha256 must be a lowercase SHA-256 digest." >&2
              exit 1
            fi
            if [[ ! "$INPUT_RECOVERY_DATA_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "Recovery publish requires one explicit YYYY-MM-DD recovery_data_date." >&2
              exit 1
            fi
            if [[ ! "$INPUT_RECOVERY_STAGE" =~ ^[a-z_]{1,64}$ ]]; then
              echo "Recovery publish stage is invalid." >&2
              exit 1
            fi
            if [[ "$(jq -r '.pipeline.attemptCount // empty' pipeline-recovery-status.json)" != "$INPUT_RECOVERY_ATTEMPT_COUNT" ]]; then
              echo "Recovery attempt generation mismatch; refusing to publish." >&2
              exit 1
            fi
            if [[ "$(jq -r '.pipeline.leaseOwner // empty' pipeline-recovery-status.json)" != "$INPUT_LEASE_OWNER" ]] || \
               [[ "$(jq -r '.pipeline.status // empty' pipeline-recovery-status.json)" != "RUNNING" ]]; then
              echo "Recovery pipeline owner/status mismatch; refusing to publish." >&2
              exit 1
            fi
            NOW_ISO="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
            if ! jq -e --arg now "$NOW_ISO" '(.pipeline.leaseExpiresAt // "") > $now' pipeline-recovery-status.json >/dev/null; then
              echo "Recovery publish lease has expired; refusing to build or activate." >&2
              exit 1
            fi
            PLAN_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
              --output recovery-plan.json \
              --write-out '%{http_code}' \
              "$FLOW_PIPELINE_WINDOW_URL/recovery/plan?recoveryId=$ENCODED_RECOVERY_ID")"
            if [[ "$PLAN_CODE" != "200" ]]; then
              echo "Approved recovery plan could not be verified (HTTP $PLAN_CODE); refusing to publish." >&2
              jq . recovery-plan.json >&2 || true
              exit 1
            fi
            jq -e --arg recoveryId "$RECOVERY_ID" --arg runKey "$RUN_KEY" \
              --arg dataDate "$INPUT_RECOVERY_DATA_DATE" --arg stage "$INPUT_RECOVERY_STAGE" \
              --arg expectedHash "$INPUT_RECOVERY_PLAN_SHA256" '
              (.recoveryId == $recoveryId) and
              (.planSha256 == .plan.planHash) and
              (.plan.runKey == $runKey) and
              ($expectedHash == "" or .plan.planHash == $expectedHash) and
              (.plan.dataDates | index($dataDate) != null) and
              (.plan.requiredStages | index($stage) != null)
            ' recovery-plan.json >/dev/null
            echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Approved recovery publish lease is valid."
            exit 0
          fi
          if [[ "$PIPELINE_WINDOW_GATE_ENABLED" != "1" && "$PIPELINE_WINDOW_GATE_ENABLED" != "true" ]]; then
            echo "gate_enabled=false" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Pipeline-window gate disabled; publishing the explicitly dispatched artifact."
            exit 0
          fi
          if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "Publish gate requires FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets." >&2
            exit 1
          fi
          AUTH_ARGS=(
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
          )
          ENCODED_RUN_KEY="$(jq -rn --arg value "$RUN_KEY" '$value|@uri')"
          STATUS_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
            --output pipeline-window-status.json \
            --write-out '%{http_code}' \
            "$FLOW_PIPELINE_WINDOW_URL/status?runKey=$ENCODED_RUN_KEY")"
          if [[ "$STATUS_CODE" != "200" ]]; then
            echo "Publish lease status failed with HTTP $STATUS_CODE; fail closed." >&2
            jq . pipeline-window-status.json >&2 || true
            exit 1
          fi
          STATUS="$(jq -r '.status // empty' pipeline-window-status.json)"
          OWNER="$(jq -r '.leaseOwner // empty' pipeline-window-status.json)"
          NOW_ISO="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          if [[ "$STATUS" == "COMPLETED" ]]; then
            echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Publish window is already completed; exiting before checkout."
            exit 0
          fi
          if [[ "$STATUS" != "RUNNING" && "$STATUS" != "DISPATCHED" ]]; then
            echo "Publish window is not leased for execution: status=$STATUS" >&2
            exit 1
          fi
          if [[ "$OWNER" != "${{ inputs.lease_owner }}" ]]; then
            echo "Publish lease owner mismatch; refusing to publish." >&2
            exit 1
          fi
          if ! jq -e --arg now "$NOW_ISO" '(.leaseExpiresAt // "") > $now' pipeline-window-status.json >/dev/null; then
            echo "Publish lease has expired; refusing to build or activate a candidate." >&2
            exit 1
          fi
          echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          echo "Publish lease is valid for $RUN_KEY."

  publish:
    needs: publish_window_gate
    if: ${{ needs.publish_window_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLOW_PUBLIC_URL: https://flow.xiaoker.com
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      FLOW_PIPELINE_WINDOW_URL: https://flow.xiaoker.com/api/v1/admin/pipeline-window
      INPUT_RUN_KEY: ${{ inputs.run_key }}
      INPUT_WINDOW_NAME: ${{ inputs.window_name }}
      INPUT_TARGET_DATE: ${{ inputs.target_date }}
      INPUT_LEASE_OWNER: ${{ inputs.lease_owner }}
      INPUT_CONTRACT_VERSION: ${{ inputs.contract_version || 'v1' }}
      INPUT_RECOVERY_ID: ${{ inputs.recovery_id || '' }}
      INPUT_RECOVERY_ATTEMPT_COUNT: ${{ inputs.recovery_attempt_count || '' }}
      INPUT_RECOVERY_PLAN_SHA256: ${{ inputs.recovery_plan_sha256 || '' }}
      INPUT_RECOVERY_DATA_DATE: ${{ inputs.recovery_data_date || '' }}
      INPUT_RECOVERY_STAGE: ${{ inputs.recovery_stage || 'publish' }}
      PIPELINE_RECOVERY_ENABLED: ${{ vars.PIPELINE_RECOVERY_ENABLED || '0' }}
    steps:
      - name: Checkout producer
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - name: Record publish start and producer identity
        shell: bash
        run: |
          set -euo pipefail
          date +%s > publish-start-epoch.txt
          PRODUCER_BUILD_SHA="$(printf '%s' "$GITHUB_SHA" | sha256sum | awk '{print $1}')"
          if [[ ! "$PRODUCER_BUILD_SHA" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Could not derive a canonical producer build digest." >&2
            exit 1
          fi
          echo "PRODUCER_BUILD_SHA=$PRODUCER_BUILD_SHA" >> "$GITHUB_ENV"

      - name: Materialize approved recovery execution contract
        if: ${{ inputs.recovery_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_ARGS=(
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
          )
          RECOVERY_ID="$INPUT_RECOVERY_ID"
          PLAN_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
            --output recovery-plan.json \
            --write-out '%{http_code}' \
            "$FLOW_PIPELINE_WINDOW_URL/recovery/plan?recoveryId=$(jq -rn --arg value "$RECOVERY_ID" '$value|@uri')")"
          if [[ "$PLAN_CODE" != "200" ]]; then
            echo "Approved recovery plan could not be read (HTTP $PLAN_CODE)." >&2
            jq . recovery-plan.json >&2 || true
            exit 1
          fi
          if [[ -z "$INPUT_RECOVERY_PLAN_SHA256" || ! "$INPUT_RECOVERY_PLAN_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "Recovery publish requires a lowercase recovery_plan_sha256." >&2
            exit 1
          fi
          jq -e --arg recoveryId "$RECOVERY_ID" --arg runKey "$INPUT_RUN_KEY" \
            --arg dataDate "$INPUT_RECOVERY_DATA_DATE" --arg stage "$INPUT_RECOVERY_STAGE" \
            --arg expectedHash "$INPUT_RECOVERY_PLAN_SHA256" '
            (.recoveryId == $recoveryId) and
            (.planSha256 == .plan.planHash) and
            (.plan.runKey == $runKey) and
            ($expectedHash == "" or .plan.planHash == $expectedHash) and
            (.plan.dataDates | index($dataDate) != null) and
            (.plan.requiredStages | index($stage) != null)
          ' recovery-plan.json >/dev/null
          cp recovery-plan.json recovery-execution.json
          echo "Recovery publish scope is fixed to one approved date/stage."

      - name: Mark recovery publish running and renew lease
        if: ${{ inputs.recovery_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg recoveryId "$INPUT_RECOVERY_ID" \
            --arg runKey "$INPUT_RUN_KEY" \
            --arg leaseOwner "$INPUT_LEASE_OWNER" \
            --arg expectedAttemptCount "$INPUT_RECOVERY_ATTEMPT_COUNT" \
            --arg githubRunId "${{ github.run_id }}" \
            '{recoveryId:$recoveryId,runKey:$runKey,leaseOwner:$leaseOwner,expectedAttemptCount:($expectedAttemptCount|tonumber),githubRunId:$githubRunId,status:"RUNNING",renewLease:true}' \
            > pipeline-recovery-publish-running.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            --header 'Content-Type: application/json' \
            --data-binary @pipeline-recovery-publish-running.json \
            "$FLOW_PIPELINE_WINDOW_URL/recovery/status" \
            --output pipeline-recovery-publish-running-response.json
          jq -e --arg attempt "$INPUT_RECOVERY_ATTEMPT_COUNT" \
            '.status == "RUNNING" and (.attemptCount|tostring) == $attempt and (.leaseExpiresAt|type == "string")' \
            pipeline-recovery-publish-running-response.json >/dev/null

      - name: Download immutable collection source bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.artifact_name }}
          path: .collection-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run_id }}

      - name: Normalize source artifact layout
        shell: bash
        run: |
          set -euo pipefail
          ROOT=".collection-source"
          SNAPSHOT="$ROOT/dashboard-snapshot.json"
          if [[ ! -s "$SNAPSHOT" ]]; then
            mapfile -t SNAPSHOTS < <(find "$ROOT" -type f -path '*/source-bundle/dashboard-snapshot.json' -print)
            if [[ "${#SNAPSHOTS[@]}" -ne 1 ]]; then
              echo "Expected exactly one nested recovery source snapshot; found ${#SNAPSHOTS[@]}." >&2
              exit 1
            fi
            SOURCE_ROOT="$(dirname "${SNAPSHOTS[0]}")"
            cp "${SNAPSHOTS[0]}" "$SNAPSHOT"
            for file in dashboard-snapshot-base.json etf-flow-state.json stock-flow-gate.json stock-flow-catalog.json stock-flow-history.json stock-flow-history-status.json stock-flow-fetch-report.json pcf-inventory.json market-history.json previous-release.json recovery-evidence.json; do
              if [[ -s "$SOURCE_ROOT/$file" ]]; then cp "$SOURCE_ROOT/$file" "$ROOT/$file"; fi
            done
            if [[ -d "$SOURCE_ROOT/stock-flow-partitions" ]]; then
              cp -R "$SOURCE_ROOT/stock-flow-partitions" "$ROOT/stock-flow-partitions"
            fi
          fi
          if [[ ! -s "$ROOT/recovery-evidence.json" ]]; then
            mapfile -t EVIDENCE < <(find "$ROOT" -type f -name recovery-evidence.json -print)
            if [[ "${#EVIDENCE[@]}" -eq 1 ]]; then cp "${EVIDENCE[0]}" "$ROOT/recovery-evidence.json"; fi
          fi

      - name: Verify source artifact identity
        shell: bash
        run: |
          set -euo pipefail
          test -s .collection-source/dashboard-snapshot.json
          WINDOW_DATE=""
          if [[ "$INPUT_RUN_KEY" =~ ^daily-market-data:([0-9]{4}-[0-9]{2}-[0-9]{2}): ]]; then
            WINDOW_DATE="${BASH_REMATCH[1]}"
          fi
          OBSERVED_AS_OF="$(jq -r '.asOf // empty' .collection-source/dashboard-snapshot.json)"
          PUBLICATION_STATUS="$(jq -r '.publication.status // empty' .collection-source/dashboard-snapshot.json)"
          echo "Source artifact date evidence: windowDate=${WINDOW_DATE:-unknown} targetDate=${INPUT_TARGET_DATE:-unknown} observedAsOf=${OBSERVED_AS_OF:-unknown} publicationStatus=${PUBLICATION_STATUS:-unknown}"
          if [[ -n "$INPUT_RECOVERY_ID" ]]; then
            jq -e --arg targetDate "$INPUT_RECOVERY_DATA_DATE" '
              (.asOf | type == "string") and
              (.asOf == $targetDate) and
              (.publication.status == "confirmed")
            ' .collection-source/dashboard-snapshot.json >/dev/null
          else
            if ! jq -e --arg targetDate "$INPUT_TARGET_DATE" '
              (.asOf | type == "string") and
              (.publication.status == "confirmed" and $targetDate != "" and .asOf == $targetDate)
            ' .collection-source/dashboard-snapshot.json >/dev/null; then
              echo "publication_as_of_mismatch windowDate=${WINDOW_DATE:-unknown} targetDate=${INPUT_TARGET_DATE:-unknown} observedAsOf=${OBSERVED_AS_OF:-unknown} publicationStatus=${PUBLICATION_STATUS:-unknown}" >&2
              exit 1
            fi
          fi
          if [[ -s .collection-source/market-history.json ]]; then
            jq -e '(.rows | type == "array") and all(.rows[]?; .trade_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$"))' \
              .collection-source/market-history.json >/dev/null
          fi

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install publisher
        run: python -m pip install -e '.[dev]'

      - name: Run targeted publish smoke tests
        run: >-
          python -m pytest -q
          tests/unit/test_publish_read_models.py
          tests/unit/test_read_models.py
          tests/unit/test_read_model_slots.py

      - name: Materialize source files
        shell: bash
        run: |
          set -euo pipefail
          cp .collection-source/dashboard-snapshot.json dashboard-snapshot.json
          for file in dashboard-snapshot-base.json etf-flow-state.json stock-flow-gate.json stock-flow-catalog.json stock-flow-history.json stock-flow-history-status.json market-history.json previous-release.json history-bundle.json ingest-bundle.json source-readiness.json source-readiness-response.json; do
            if [[ -s ".collection-source/$file" ]]; then cp ".collection-source/$file" "$file"; fi
          done
          if [[ -d .collection-source/stock-flow-partitions ]]; then
            cp -R .collection-source/stock-flow-partitions stock-flow-partitions
          fi

      - name: Build immutable read-model candidates offline
        id: build_models
        shell: bash
        run: |
          set -euo pipefail
          if ! jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null; then
            echo "Source snapshot is pending; no read-model candidate will be built."
            echo "penetration_status=NOT_REQUIRED" >> "$GITHUB_OUTPUT"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HISTORY_ARGS=()
          if [[ -s market-history.json ]]; then HISTORY_ARGS+=(--market-history market-history.json); fi
          if [[ -s previous-release.json ]]; then HISTORY_ARGS+=(--previous-manifest previous-release.json); fi
          STOCK_FLOW_GATE_EXIT=0
          python scripts/verify_stock_flow_bundle.py \
            --snapshot dashboard-snapshot.json \
            --catalog stock-flow-catalog.json \
            --history stock-flow-history.json \
            --history-status stock-flow-history-status.json \
            > stock-flow-gate.json || STOCK_FLOW_GATE_EXIT=$?
          if [[ ! -s stock-flow-gate.json ]]; then
            jq -n '{valid:false,status:"BLOCKED_QUALITY",reason:"stock_flow_gate_no_decision"}' > stock-flow-gate.json
          fi
          STOCK_FLOW_DECISION="$(cat stock-flow-gate.json)"
          HISTORY_STATUS="$(jq -r '.status' <<<"$STOCK_FLOW_DECISION")"
          if (( STOCK_FLOW_GATE_EXIT != 0 )) || [[ "$(jq -r '.valid' <<<"$STOCK_FLOW_DECISION")" != "true" ]]; then
            echo "ETF-to-stock history gate rejected the source bundle:" >&2
            jq . <<<"$STOCK_FLOW_DECISION" >&2
            exit 1
          fi
          if [[ "$HISTORY_STATUS" == "READY" && -s stock-flow-catalog.json && -s stock-flow-history.json ]]; then
            python scripts/build_stock_pressure_state.py \
              --catalog stock-flow-catalog.json \
              --output stock-pressure-catalog.json \
              --daily-partitions stock-flow-history.json
            python scripts/build_read_models.py \
              --snapshot dashboard-snapshot.json \
              --output-dir read-models-full \
              --stock-catalog stock-pressure-catalog.json \
              --require-materialized \
              --producer-build-sha "${PRODUCER_BUILD_SHA}" \
              "${HISTORY_ARGS[@]}"
            python scripts/split_read_model_slots.py --source-dir read-models-full --output-dir read-models-dashboard --slot dashboard
            python scripts/split_read_model_slots.py --source-dir read-models-full --output-dir read-models-penetration --slot etf_penetration
            python scripts/report_read_model_sizes.py --read-model-dir read-models-full --output artifact-size-report.json
          else
            if [[ "$HISTORY_STATUS" == "READY" ]]; then
              HISTORY_STATUS="BLOCKED_QUALITY"
            fi
            python scripts/build_read_models.py \
              --slot dashboard \
              --snapshot dashboard-snapshot.json \
              --output-dir read-models-dashboard \
              --require-materialized \
              --producer-build-sha "${PRODUCER_BUILD_SHA}" \
              "${HISTORY_ARGS[@]}"
            python scripts/report_read_model_sizes.py --read-model-dir read-models-dashboard --output artifact-size-report.json
          fi
          echo "penetration_status=$HISTORY_STATUS" >> "$GITHUB_OUTPUT"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Check dashboard capability contract
        if: ${{ steps.build_models.outputs.ready == 'true' }}
        run: python scripts/check_release_capabilities.py --slot dashboard --output dashboard-capabilities.json

      # Check every candidate slot before activating any one of them.  A
      # capability failure must not leave dashboard advanced while ETF
      # penetration remains on an older release.
      - name: Check ETF penetration capability contract before activation
        if: ${{ steps.build_models.outputs.ready == 'true' && hashFiles('read-models-penetration/manifest.json') != '' }}
        run: python scripts/check_release_capabilities.py --slot etf_penetration --output penetration-capabilities.json

      - name: Stage dashboard candidate
        if: ${{ steps.build_models.outputs.ready == 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/publish_read_models.py \
            --read-model-dir read-models-dashboard \
            --slot dashboard \
            --stage-only \
            --result-output dashboard-read-model-publish.json \
            --metrics-output dashboard-publish-metrics.json

      - name: Verify and activate dashboard candidate
        if: ${{ steps.build_models.outputs.ready == 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "staged_candidate"' dashboard-read-model-publish.json >/dev/null
          RELEASE_ID="$(jq -r '.releaseId' read-models-dashboard/manifest.json)"
          AS_OF="$(jq -r '.asOf' read-models-dashboard/manifest.json)"
          python scripts/verify_published_release.py \
            --release-id "$RELEASE_ID" \
            --as-of "$AS_OF" \
            --slot dashboard \
            --candidate \
            --metrics-output dashboard-canary-metrics.json > dashboard-release-canary.json
          python scripts/activate_read_models.py \
            --release-id "$RELEASE_ID" \
            --as-of "$AS_OF" \
            --slot dashboard \
            --metrics-output dashboard-activation-metrics.json > dashboard-read-model-activation.json
          jq -e --arg releaseId "$RELEASE_ID" --arg asOf "$AS_OF" \
            '.releaseId == $releaseId and .asOf == $asOf and .slot == "dashboard" and (.status == "activated" or .status == "staged_older_than_active" or .status == "staged_stale_revision")' \
            dashboard-read-model-activation.json >/dev/null

      - name: Check and stage ETF penetration candidate
        if: ${{ steps.build_models.outputs.ready == 'true' && hashFiles('read-models-penetration/manifest.json') != '' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/publish_read_models.py \
            --read-model-dir read-models-penetration \
            --slot etf_penetration \
            --stage-only \
            --result-output penetration-read-model-publish.json \
            --metrics-output penetration-publish-metrics.json

      - name: Verify and activate ETF penetration candidate
        if: ${{ success() && hashFiles('read-models-penetration/manifest.json') != '' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.status == "staged_candidate"' penetration-read-model-publish.json >/dev/null
          RELEASE_ID="$(jq -r '.releaseId' read-models-penetration/manifest.json)"
          AS_OF="$(jq -r '.asOf' read-models-penetration/manifest.json)"
          python scripts/verify_published_release.py \
            --release-id "$RELEASE_ID" \
            --as-of "$AS_OF" \
            --slot etf_penetration \
            --candidate \
            --metrics-output penetration-canary-metrics.json > penetration-release-canary.json
          python scripts/activate_read_models.py \
            --release-id "$RELEASE_ID" \
            --as-of "$AS_OF" \
            --slot etf_penetration \
            --metrics-output penetration-activation-metrics.json > penetration-read-model-activation.json
          jq -e --arg releaseId "$RELEASE_ID" --arg asOf "$AS_OF" \
            '.releaseId == $releaseId and .asOf == $asOf and .slot == "etf_penetration" and (.status == "activated" or .status == "staged_older_than_active" or .status == "staged_stale_revision")' \
            penetration-read-model-activation.json >/dev/null

      - name: Record measured recovery resource metrics
        if: ${{ always() && inputs.recovery_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          METRIC_ARGS=()
          for file in dashboard-publish-metrics.json dashboard-canary-metrics.json dashboard-activation-metrics.json penetration-publish-metrics.json penetration-canary-metrics.json penetration-activation-metrics.json; do
            if [[ -s "$file" ]]; then METRIC_ARGS+=(--metrics "$file"); fi
          done
          mkdir -p .recovery/recovery-resource
          python scripts/measure_recovery_resources.py \
            --start-epoch publish-start-epoch.txt \
            --source-evidence .collection-source/recovery-evidence.json \
            --control-response pipeline-recovery-publish-running-response.json \
            "${METRIC_ARGS[@]}" \
            --output .recovery/recovery-resource/recovery-resource-metrics.json

      - name: Create canonical recovery receipts
        if: ${{ success() && inputs.recovery_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          ACTIVE_AFTER="dashboard-read-model-activation.json"
          if [[ -s penetration-read-model-activation.json ]]; then ACTIVE_AFTER="penetration-read-model-activation.json"; fi
          python scripts/create_live_recovery_receipts.py \
            --plan recovery-execution.json \
            --expected-plan-hash "$INPUT_RECOVERY_PLAN_SHA256" \
            --attempt "$INPUT_RECOVERY_ATTEMPT_COUNT" \
            --producer-build-sha "$PRODUCER_BUILD_SHA" \
            --source-dir .collection-source \
            --models-dir . \
            --evidence-dir . \
            --resource-metrics .recovery/recovery-resource/recovery-resource-metrics.json \
            --publish-run-id "${{ github.run_id }}" \
            --active-before .collection-source/previous-release.json \
            --active-after "$ACTIVE_AFTER" \
            --output-dir .recovery/recovery-receipts

      - name: Upload immutable recovery receipts
        if: ${{ success() && inputs.recovery_id != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "Recovery receipt upload requires FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets." >&2
            exit 1
          fi
          ENCODED_RECOVERY_ID="$(jq -rn --arg value "$INPUT_RECOVERY_ID" '$value|@uri')"
          shopt -s nullglob
          METAS=(.recovery/recovery-receipts/*.meta.json)
          if (( ${#METAS[@]} == 0 )); then
            echo "Recovery receipt upload found no receipt metadata files." >&2
            exit 1
          fi
          for META in "${METAS[@]}"; do
            RECEIPT="${META%.meta.json}.json"
            if [[ ! -s "$RECEIPT" ]]; then
              echo "Recovery receipt payload is missing or empty for $META." >&2
              exit 1
            fi
            KEY="$(jq -er '.key' "$META")"
            SHA="$(jq -er '.sha256' "$META")"
            STAGE="$(jq -er '.stage' "$META")"
            if [[ ! "$STAGE" =~ ^[a-z_]{1,64}$ || ! "$KEY" =~ ^market-data/recovery/receipts/ || ! "$SHA" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Recovery receipt metadata failed the upload contract." >&2
              exit 1
            fi
            ACTUAL_SHA="$(sha256sum "$RECEIPT" | awk '{print $1}')"
            if [[ "$ACTUAL_SHA" != "$SHA" ]]; then
              echo "Recovery receipt SHA-256 does not match its metadata." >&2
              exit 1
            fi
            RESPONSE=".recovery/recovery-receipts/upload-${STAGE}.json"
            CODE="$(curl --silent --show-error \
              --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
              --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
              --header "X-Flow-Recovery-Receipt-Key: $KEY" \
              --header "X-Flow-Recovery-Receipt-Sha256: $SHA" \
              --header "Content-Type: application/json" \
              --data-binary "@$RECEIPT" \
              --output "$RESPONSE" \
              --write-out '%{http_code}' \
              "$FLOW_PIPELINE_WINDOW_URL/recovery/receipt?recoveryId=$ENCODED_RECOVERY_ID")"
            if [[ "$CODE" != "200" && "$CODE" != "201" ]]; then
              jq '{error,status,key,sha256,idempotent}' "$RESPONSE" >&2 || true
              exit 1
            fi
            jq -e --arg key "$KEY" --arg sha "$SHA" \
              '(.status == "stored") and (.key == $key) and (.sha256 == $sha)' \
              "$RESPONSE" >/dev/null
          done

      - name: Record publish resource budget
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p reports/budget
          python scripts/report_stage_budget.py \
            --stage publish \
            --run-key "$INPUT_RUN_KEY" \
            --actions-minutes 0 \
            --actions-run-attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --output reports/budget/publish.json

      - name: Mark pipeline window terminal status
        if: ${{ always() && needs.publish_window_gate.outputs.gate_enabled == 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          STATUS="COMPLETED"
          ERROR_CODE=""
          LATEST_RECEIPT_KEY=""
          LATEST_RECEIPT_SHA256=""
          SOURCE_FINGERPRINT=""
          SNAPSHOT_PATH="dashboard-snapshot.json"
          if [[ ! -s "$SNAPSHOT_PATH" && -s ".collection-source/dashboard-snapshot.json" ]]; then
            SNAPSHOT_PATH=".collection-source/dashboard-snapshot.json"
          fi
          COMPLETION_AS_OF="$(jq -r '.asOf // empty' "$SNAPSHOT_PATH" 2>/dev/null || true)"
          PUBLICATION_STATUS="$(jq -r '.publication.status // empty' "$SNAPSHOT_PATH" 2>/dev/null || true)"
          PENETRATION_STATUS="${{ steps.build_models.outputs.penetration_status }}"
          HISTORY_ERROR_CODE="$(jq -r '.errorCode // empty' stock-flow-history-status.json 2>/dev/null || true)"
          STOCK_FLOW_GATE_VALID="$(jq -r '.valid // "unknown"' stock-flow-gate.json 2>/dev/null || echo "unknown")"
          STOCK_FLOW_GATE_REASON="$(jq -r '.reason // empty' stock-flow-gate.json 2>/dev/null || true)"
          if [[ "$PENETRATION_STATUS" == "BLOCKED_QUALITY" ]]; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="${HISTORY_ERROR_CODE:-stock_flow_history_incomplete}"
          elif [[ "$PENETRATION_STATUS" == "FAILED_RETRYABLE" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="${HISTORY_ERROR_CODE:-stock_flow_history_fetch_failed}"
          elif [[ "$STOCK_FLOW_GATE_VALID" == "false" ]]; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="${STOCK_FLOW_GATE_REASON:-stock_flow_history_incomplete}"
          elif [[ -s "$SNAPSHOT_PATH" && "$PUBLICATION_STATUS" == "confirmed" ]] && \
            { [[ -z "$INPUT_TARGET_DATE" ]] || [[ "$COMPLETION_AS_OF" != "$INPUT_TARGET_DATE" ]]; }; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="publication_as_of_mismatch"
            WINDOW_DATE="unknown"
            if [[ "$INPUT_RUN_KEY" =~ ^daily-market-data:([0-9]{4}-[0-9]{2}-[0-9]{2}): ]]; then
              WINDOW_DATE="${BASH_REMATCH[1]}"
            fi
            echo "publication_as_of_mismatch windowDate=$WINDOW_DATE targetDate=${INPUT_TARGET_DATE:-unknown} observedAsOf=${COMPLETION_AS_OF:-unknown} publicationStatus=${PUBLICATION_STATUS:-unknown}" >&2
          elif [[ "${{ job.status }}" != "success" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="publish_workflow_failed"
          elif [[ ! -s dashboard-snapshot.json ]] || ! jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null 2>&1; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="source_not_ready"
          elif [[ -s dashboard-snapshot.json ]] && jq -e '(.errors | length > 0) or (.phase0_gate_status == "blocked")' dashboard-snapshot.json >/dev/null 2>&1; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="quality_gate_blocked"
          fi
          if [[ -n "$INPUT_RECOVERY_ID" && "$STATUS" == "COMPLETED" ]]; then
            SOURCE_FINGERPRINT="$(jq -r '.sourceFingerprint // empty' .collection-source/recovery-evidence.json 2>/dev/null || true)"
            if [[ ! "$SOURCE_FINGERPRINT" =~ ^[0-9a-f]{64}$ ]]; then
              STATUS="BLOCKED_QUALITY"
              ERROR_CODE="recovery_source_fingerprint_missing"
            fi
          fi
          if [[ -n "$INPUT_RECOVERY_ID" && "$STATUS" == "COMPLETED" ]]; then
            if [[ ! -s .recovery/recovery-receipts/publish.meta.json ]]; then
              STATUS="BLOCKED_QUALITY"
              ERROR_CODE="recovery_completion_receipt_missing"
            else
              LATEST_RECEIPT_KEY="$(jq -r '.key' .recovery/recovery-receipts/publish.meta.json)"
              LATEST_RECEIPT_SHA256="$(jq -r '.sha256' .recovery/recovery-receipts/publish.meta.json)"
              if [[ ! "$LATEST_RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ || -z "$LATEST_RECEIPT_KEY" ]]; then
                STATUS="BLOCKED_QUALITY"
                ERROR_CODE="recovery_completion_receipt_metadata_invalid"
              fi
            fi
          fi
          if [[ -n "$INPUT_RECOVERY_ID" ]]; then
            if [[ "$PIPELINE_RECOVERY_ENABLED" != "1" && "$PIPELINE_RECOVERY_ENABLED" != "true" ]]; then
              echo "PIPELINE_RECOVERY_ENABLED is disabled; refusing recovery terminal update." >&2
              exit 1
            fi
            if [[ -z "$INPUT_RECOVERY_ATTEMPT_COUNT" || ! "$INPUT_RECOVERY_ATTEMPT_COUNT" =~ ^[0-9]+$ ]]; then
              echo "Recovery terminal update is missing a valid attempt count." >&2
              exit 1
            fi
            jq -n \
              --arg recoveryId "$INPUT_RECOVERY_ID" \
              --arg runKey "$INPUT_RUN_KEY" \
              --arg leaseOwner "$INPUT_LEASE_OWNER" \
              --arg expectedAttemptCount "$INPUT_RECOVERY_ATTEMPT_COUNT" \
              --arg githubRunId "${{ github.run_id }}" \
              --arg status "$STATUS" \
              --arg errorCode "$ERROR_CODE" \
              --arg latestReceiptKey "$LATEST_RECEIPT_KEY" \
              --arg latestReceiptSha256 "$LATEST_RECEIPT_SHA256" \
              --arg sourceFingerprint "$SOURCE_FINGERPRINT" \
              '{recoveryId:$recoveryId,runKey:$runKey,leaseOwner:$leaseOwner,expectedAttemptCount:($expectedAttemptCount|tonumber),githubRunId:$githubRunId,status:$status,errorCode:(if $errorCode == "" then null else $errorCode end),sourceFingerprint:(if $sourceFingerprint == "" then null else $sourceFingerprint end),latestReceiptKey:(if $latestReceiptKey == "" then null else $latestReceiptKey end),latestReceiptSha256:(if $latestReceiptSha256 == "" then null else $latestReceiptSha256 end)}' \
              > pipeline-recovery-terminal.json
            TERMINAL_URL="$FLOW_PIPELINE_WINDOW_URL/recovery/status"
            TERMINAL_PAYLOAD="pipeline-recovery-terminal.json"
          else
            jq -n \
              --arg runKey "$INPUT_RUN_KEY" \
              --arg leaseOwner "$INPUT_LEASE_OWNER" \
              --arg githubRunId "${{ github.run_id }}" \
              --arg status "$STATUS" \
              --arg errorCode "$ERROR_CODE" \
              --arg completionAsOf "$COMPLETION_AS_OF" \
              --arg publicationStatus "$PUBLICATION_STATUS" \
              '{runKey:$runKey,leaseOwner:$leaseOwner,githubRunId:$githubRunId,status:$status,errorCode:(if $errorCode == "" then null else $errorCode end),completionAsOf:(if $status == "COMPLETED" then (if $completionAsOf == "" then null else $completionAsOf end) else null end),publicationStatus:(if $status == "COMPLETED" then (if $publicationStatus == "" then null else $publicationStatus end) else null end)}' \
              > pipeline-window-terminal.json
            TERMINAL_URL="$FLOW_PIPELINE_WINDOW_URL/status"
            TERMINAL_PAYLOAD="pipeline-window-terminal.json"
          fi
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary "@$TERMINAL_PAYLOAD" \
            "$TERMINAL_URL" \
            --output pipeline-window-terminal-response.json
          if [[ "$STATUS" != "COMPLETED" ]]; then
            echo "Pipeline window closed as $STATUS ($ERROR_CODE)." >&2
            exit 1
          fi

      - name: Preserve publish evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: market-data-publish-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            pipeline-window-status.json
            pipeline-window-terminal.json
            pipeline-window-terminal-response.json
            pipeline-recovery-status.json
            pipeline-recovery-publish-running.json
            pipeline-recovery-publish-running-response.json
            pipeline-recovery-terminal.json
            pipeline-recovery-terminal-response.json
            dashboard-snapshot.json
            market-history.json
            previous-release.json
            stock-flow-gate.json
            stock-flow-history.json
            stock-flow-history-status.json
            stock-pressure-catalog.json
            artifact-size-report.json
            dashboard-capabilities.json
            dashboard-read-model-publish.json
            dashboard-release-canary.json
            dashboard-read-model-activation.json
            penetration-capabilities.json
            penetration-read-model-publish.json
            penetration-release-canary.json
            penetration-read-model-activation.json
            .recovery/recovery-receipts
            reports/budget/publish.json
            publish-start-epoch.txt
            dashboard-publish-metrics.json
            dashboard-canary-metrics.json
            dashboard-activation-metrics.json
            penetration-publish-metrics.json
            penetration-canary-metrics.json
            penetration-activation-metrics.json
            .recovery/recovery-resource/
            .recovery/recovery-receipts/
            read-models-dashboard/
            read-models-penetration/
