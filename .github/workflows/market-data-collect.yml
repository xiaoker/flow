name: Market data collect

on:
  # The heavy collector is dispatch-only. Cloudflare Cron is the primary
  # dispatcher and market-data-watchdog.yml is the lightweight failover.
  # Keeping schedules out of this file prevents a second scheduler from
  # paying for a complete collection run on every release window.
  workflow_dispatch:
    inputs:
      dates:
        description: "Optional three YYYY-MM-DD dates separated by spaces"
        required: false
        type: string
      collection_window:
        description: "Release window used for collection audit and reconciliation"
        required: false
        default: "auto"
        type: choice
        options: [auto, evening, morning, reconcile]
      run_key:
        description: "Stable pipeline run key from the Cloudflare scheduler"
        required: false
        default: ""
        type: string
      window_name:
        description: "Stable scheduler window name"
        required: false
        default: ""
        type: string
      target_date:
        description: "Shanghai business date associated with the scheduler window"
        required: false
        default: ""
        type: string
      lease_owner:
        description: "Lease owner assigned by the scheduler"
        required: false
        default: ""
        type: string
      contract_version:
        description: "Pipeline run-key contract version"
        required: false
        default: "v1"
        type: string
      run_pcf_shadow:
        description: "Opt in to one legacy/v2 PCF parity run; never publishes v2"
        required: false
        default: false
        type: boolean
      delegate_publish:
        description: "Dispatch the resumable publish stage after collection"
        required: false
        default: true
        type: boolean

# Cloudflare Cron is the primary release-window dispatcher. The watchdog owns
# the GitHub schedule and only dispatches this workflow when its lease check
# proves that a window is missing, expired or retryable. Early runs preserve
# whichever official sources are already available; only a complete
# same-trading-day snapshot is allowed to replace the active dashboard.

permissions:
  contents: read
  actions: write

concurrency:
  group: market-data-collect
  # Concurrency is only a last-resort serialisation guard.
  # pipeline_window is the idempotency boundary. Concurrency is not cross-scheduler deduplication.
  cancel-in-progress: false

jobs:
  pipeline_window_gate:
    runs-on: ubuntu-latest
    # This small job runs before checkout, Python setup, dependency install or
    # pytest.  With the flag enabled it is the only place that may acquire a
    # cross-scheduler lease for this workflow invocation.
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      gate_enabled: ${{ steps.gate.outputs.gate_enabled }}
      run_key: ${{ steps.gate.outputs.run_key }}
      window_name: ${{ steps.gate.outputs.window_name }}
      target_date: ${{ steps.gate.outputs.target_date }}
      lease_owner: ${{ steps.gate.outputs.lease_owner }}
      contract_version: ${{ steps.gate.outputs.contract_version }}
      delegate_publish: ${{ steps.gate.outputs.delegate_publish }}
    env:
      # The gate is now the production default. An explicit repository value
      # of 0 remains the coordinated rollback switch.
      PIPELINE_WINDOW_GATE_ENABLED: ${{ vars.PIPELINE_WINDOW_GATE_ENABLED || '1' }}
      FLOW_PIPELINE_WINDOW_URL: https://flow.xiaoker.com/api/v1/admin/pipeline-window
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
      INPUT_COLLECTION_WINDOW: ${{ inputs.collection_window || 'auto' }}
      INPUT_RUN_KEY: ${{ inputs.run_key || '' }}
      INPUT_WINDOW_NAME: ${{ inputs.window_name || '' }}
      INPUT_TARGET_DATE: ${{ inputs.target_date || '' }}
      INPUT_LEASE_OWNER: ${{ inputs.lease_owner || '' }}
      INPUT_CONTRACT_VERSION: ${{ inputs.contract_version || 'v1' }}
    steps:
      - name: Claim or skip pipeline window
        id: gate
        shell: bash
        run: |
          set -euo pipefail

          WINDOW="$INPUT_WINDOW_NAME"
          if [[ -z "$WINDOW" || "$WINDOW" == "auto" ]]; then
            WINDOW="$INPUT_COLLECTION_WINDOW"
          fi
          if [[ -z "$WINDOW" || "$WINDOW" == "auto" ]]; then
            case "${{ github.event.schedule || '' }}" in
              "45 10 * * 1-5") WINDOW="evening" ;;
              "0 0 * * 1-5") WINDOW="morning" ;;
              "55 0 * * 1-5"|"15 1 * * 1-5"|"45 1 * * 1-5") WINDOW="reconcile" ;;
              *) WINDOW="evening" ;;
            esac
          fi

          WINDOW_DATE="$(TZ=Asia/Shanghai date '+%Y-%m-%d')"
          CONTRACT_VERSION="$INPUT_CONTRACT_VERSION"
          RUN_KEY="$INPUT_RUN_KEY"
          if [[ -n "$RUN_KEY" ]]; then
            if [[ ! "$RUN_KEY" =~ ^daily-market-data:([0-9]{4}-[0-9]{2}-[0-9]{2}):([a-z_]+):(v[0-9]+)$ ]]; then
              echo "Invalid run_key input: $RUN_KEY" >&2
              exit 1
            fi
            WINDOW_DATE="${BASH_REMATCH[1]}"
            WINDOW="${BASH_REMATCH[2]}"
            CONTRACT_VERSION="${BASH_REMATCH[3]}"
          else
            RUN_KEY="daily-market-data:${WINDOW_DATE}:${WINDOW}:${CONTRACT_VERSION}"
          fi
          if [[ "${{ inputs.delegate_publish }}" == "false" ]]; then
            DELEGATE_PUBLISH="false"
          else
            DELEGATE_PUBLISH="true"
          fi
          TARGET_DATE="${INPUT_TARGET_DATE:-$WINDOW_DATE}"
          LEASE_OWNER="${INPUT_LEASE_OWNER:-github:${GITHUB_RUN_ID}}"
          {
            echo "run_key=$RUN_KEY"
            echo "window_name=$WINDOW"
            echo "target_date=$TARGET_DATE"
            echo "lease_owner=$LEASE_OWNER"
            echo "contract_version=$CONTRACT_VERSION"
            echo "delegate_publish=$DELEGATE_PUBLISH"
          } >> "$GITHUB_OUTPUT"

          if [[ "$PIPELINE_WINDOW_GATE_ENABLED" != "1" && "$PIPELINE_WINDOW_GATE_ENABLED" != "true" ]]; then
            echo "gate_enabled=false" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Pipeline-window gate is disabled; preserving legacy workflow behavior."
            exit 0
          fi

          if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "Pipeline-window gate requires FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets." >&2
            exit 1
          fi
          AUTH_ARGS=(
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY"
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID"
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET"
          )
          ENCODED_RUN_KEY="$(jq -rn --arg value "$RUN_KEY" '$value|@uri')"
          STATUS_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
            --output pipeline-window-status.json \
            --write-out '%{http_code}' \
            "$FLOW_PIPELINE_WINDOW_URL/status?runKey=$ENCODED_RUN_KEY")"
          if [[ "$STATUS_CODE" == "200" ]] && jq -e '.status == "COMPLETED"' pipeline-window-status.json >/dev/null; then
            echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Pipeline window already completed; exiting before checkout and dependency installation."
            exit 0
          fi
          # Cloudflare already acquired the lease before dispatching this
          # workflow.  The dispatched run consumes that lease; it must not
          # claim the same active row again and mistake its own lease for a
          # duplicate.  A second run with the same owner is allowed only while
          # the row is still DISPATCHED; once RUNNING, it exits below.
          NOW_ISO="$(date -u '+%Y-%m-%dT%H:%M:%S.000Z')"
          if [[ "$STATUS_CODE" == "200" ]] && jq -e --arg owner "$LEASE_OWNER" --arg now "$NOW_ISO" \
            '.status == "DISPATCHED" and .leaseOwner == $owner and (.leaseExpiresAt // "") > $now' pipeline-window-status.json >/dev/null; then
            echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Consuming the lease acquired by the Cloudflare dispatcher."
            exit 0
          fi
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "404" ]]; then
            echo "Pipeline-window status check failed with HTTP $STATUS_CODE" >&2
            jq . pipeline-window-status.json >&2 || true
            exit 1
          fi

          jq -n \
            --arg runKey "$RUN_KEY" \
            --arg pipeline "daily-market-data" \
            --arg windowDate "$WINDOW_DATE" \
            --arg windowName "$WINDOW" \
            --arg contractVersion "$CONTRACT_VERSION" \
            --arg targetDate "$TARGET_DATE" \
            --arg leaseOwner "$LEASE_OWNER" \
            --arg githubRunId "$GITHUB_RUN_ID" \
            '{runKey:$runKey,pipeline:$pipeline,windowDate:$windowDate,windowName:$windowName,contractVersion:$contractVersion,targetDate:$targetDate,leaseOwner:$leaseOwner,githubRunId:$githubRunId}' \
            > pipeline-window-claim-request.json
          CLAIM_CODE="$(curl --silent --show-error "${AUTH_ARGS[@]}" \
            --header 'Content-Type: application/json' \
            --data-binary @pipeline-window-claim-request.json \
            --output pipeline-window-claim.json \
            --write-out '%{http_code}' \
            "$FLOW_PIPELINE_WINDOW_URL/claim")"
          if [[ "$CLAIM_CODE" != "200" ]]; then
            echo "Pipeline-window claim failed with HTTP $CLAIM_CODE; fail closed without dispatch." >&2
            jq . pipeline-window-claim.json >&2 || true
            exit 1
          fi
          DECISION="$(jq -r '.decision // empty' pipeline-window-claim.json)"
          case "$DECISION" in
            acquired|takeover)
              echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
              echo "should_run=true" >> "$GITHUB_OUTPUT"
              ;;
            skip_completed|skip_leased|skip_blocked_quality)
              echo "gate_enabled=true" >> "$GITHUB_OUTPUT"
              echo "should_run=false" >> "$GITHUB_OUTPUT"
              echo "Pipeline-window decision=$DECISION; exiting before checkout and dependency installation."
              ;;
            *)
              echo "Unknown pipeline-window decision: $DECISION" >&2
              exit 1
              ;;
          esac
          jq '{runKey,decision,status,leaseOwner,leaseExpiresAt,attemptCount,rowsWritten}' pipeline-window-claim.json

  collect:
    needs: pipeline_window_gate
    if: ${{ needs.pipeline_window_gate.outputs.should_run == 'true' }}
    runs-on: ubuntu-latest
    # Each window performs one bounded collection. Source timing is represented
    # as pending and reconciled by the next window, not by a long-running job.
    timeout-minutes: 20
    env:
      INPUT_DATES: ${{ inputs.dates }}
      INPUT_COLLECTION_WINDOW: ${{ needs.pipeline_window_gate.outputs.window_name }}
      INPUT_RUN_KEY: ${{ needs.pipeline_window_gate.outputs.run_key }}
      INPUT_WINDOW_NAME: ${{ needs.pipeline_window_gate.outputs.window_name }}
      INPUT_TARGET_DATE: ${{ needs.pipeline_window_gate.outputs.target_date }}
      INPUT_LEASE_OWNER: ${{ needs.pipeline_window_gate.outputs.lease_owner }}
      INPUT_CONTRACT_VERSION: ${{ needs.pipeline_window_gate.outputs.contract_version }}
      INPUT_DELEGATE_PUBLISH: ${{ needs.pipeline_window_gate.outputs.delegate_publish }}
      PIPELINE_WINDOW_GATE_ENABLED: ${{ needs.pipeline_window_gate.outputs.gate_enabled }}
      FLOW_PIPELINE_WINDOW_URL: https://flow.xiaoker.com/api/v1/admin/pipeline-window
      PUBLISH_URL: https://flow.xiaoker.com/api/v1/admin/import
      FLOW_SOURCE_PROXY_URL: https://flow.xiaoker.com/api/v1/admin/source-proxy
      FLOW_READINESS_URL: https://flow.xiaoker.com/api/v1/admin/source-readiness
      FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
      FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
      FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1, Node 24

      - name: Mark pipeline window running
        if: ${{ needs.pipeline_window_gate.outputs.gate_enabled == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg runKey "$INPUT_RUN_KEY" \
            --arg leaseOwner "$INPUT_LEASE_OWNER" \
            --arg githubRunId "${{ github.run_id }}" \
            '{runKey:$runKey,leaseOwner:$leaseOwner,githubRunId:$githubRunId,status:"RUNNING"}' \
            > pipeline-window-running.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @pipeline-window-running.json \
            "$FLOW_PIPELINE_WINDOW_URL/status" \
            --output pipeline-window-running-response.json

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0, Node 24
        with:
          python-version: "3.12"
          cache: pip

      - name: Install collector
        run: python -m pip install -e '.[dev]'

      - name: Run targeted collection smoke tests
        run: >-
          python -m pytest -q
          tests/unit/test_official_adapters.py
          tests/unit/test_source_readiness.py
          tests/unit/test_release_contract_scripts.py

      - name: Resolve trading dates
        id: dates
        shell: bash
        run: |
          if [[ -n "$INPUT_DATES" ]]; then
            DATES="$INPUT_DATES"
          else
            DATES="$(python scripts/select_recent_trading_dates.py --count 3)"
          fi
          if [[ ! "$DATES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}\ [0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Expected exactly three ISO dates, got: $DATES" >&2
            exit 1
          fi
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"
          echo "latest=${DATES##* }" >> "$GITHUB_OUTPUT"

      - name: Resolve source release window
        id: window
        shell: bash
        run: |
          WINDOW="$INPUT_COLLECTION_WINDOW"
          if [[ "$WINDOW" == "auto" ]]; then
            case "${{ github.event.schedule || '' }}" in
              "45 10 * * 1-5") WINDOW="evening" ;;
              "0 0 * * 1-5") WINDOW="morning" ;;
              "55 0 * * 1-5") WINDOW="reconcile" ;;
              "15 1 * * 1-5") WINDOW="reconcile" ;;
              "45 1 * * 1-5") WINDOW="reconcile" ;;
            esac
          fi
          echo "collection_window=$WINDOW" >> "$GITHUB_OUTPUT"
          echo "Using collection window: $WINDOW"

      - name: Collect and validate official data
        id: collection
        shell: bash
        run: |
          read -r -a DATES <<< "${{ steps.dates.outputs.dates }}"
          MAX_ATTEMPTS=3
          COLLECTION_WINDOW="${{ steps.window.outputs.collection_window }}"
          # PCF requires two official requests per changed ETF.  Keep the
          # daily window bounded; larger inventories belong to the resumable
          # backfill/reconcile workflow and are never silently treated as
          # complete by this release.
          PCF_MAX_CODES=16
          attempt=1
          echo "pending=false" >> "$GITHUB_OUTPUT"

          # A release window is deliberately one-shot. A source that has not
          # published the requested date is a pending state, not a reason to
          # keep an Actions runner alive for a long readiness poll. The next
          # Cloudflare or GitHub window will collect the same dates again and
          # the ingest layer will deduplicate the raw evidence.
          while (( attempt <= MAX_ATTEMPTS )); do
            trading-desk collect-phase0 \
              --dates "${DATES[@]}" \
              --window "${{ steps.window.outputs.collection_window }}" \
              --pcf-max-codes "$PCF_MAX_CODES"
            if jq -e '.phase0_gate_status != "blocked"' \
              reports/phase0/latest-quality-summary.json >/dev/null; then
              echo "Official sources passed the collection gate for this window."
              break
            fi

            # A successful response with an older business date is a source
            # readiness condition. Preserve the response and finish this
            # window; do not retry it as if it were a transport failure.
            if jq -e '
              (.errors | length == 0) and
              (.phase0_gate_status == "pending" or
              any(.findings[]?;
                (.check_id == "timeliness.requested_date_coverage" and
                 .status == "fail")))
            ' reports/phase0/latest-quality-summary.json >/dev/null; then
              echo "Official source date is not ready; this window is pending and the next window will retry." >&2
              echo "pending=true" >> "$GITHUB_OUTPUT"
              {
                echo "## Collection window pending"
                echo "- window: $COLLECTION_WINDOW"
                echo "- reason: official source has not published the requested business date"
                jq -r '.findings[]? | select(.check_id == "timeliness.requested_date_coverage" and .status == "fail") | "- dataset: \(.dataset)\n- message: \(.message)"' reports/phase0/latest-quality-summary.json
              } >> "$GITHUB_STEP_SUMMARY"
              break
            fi

            # Only retry explicit transport failures. Schema, mapping,
            # authentication and data-quality failures must remain visible and
            # fail closed instead of being hidden by repeated collection.
            if (( attempt >= MAX_ATTEMPTS )) || \
              ! jq -e '(.errors | length > 0) and all(.errors[]; .error_type == "ConnectionError" or .error_type == "HTTPError")' \
                reports/phase0/latest-quality-summary.json >/dev/null; then
              break
            fi
            echo "Transient official-source failure; retrying collection attempt $((attempt + 1))/$MAX_ATTEMPTS." >&2
            echo "- network retry: attempt $((attempt + 1))/$MAX_ATTEMPTS" >> "$GITHUB_STEP_SUMMARY"
            sleep $((attempt * 30))
            attempt=$((attempt + 1))
          done
          echo "phase0_gate=$(jq -r '.phase0_gate_status' reports/phase0/latest-quality-summary.json)" >> "$GITHUB_OUTPUT"
          echo "pending_domains=$(jq -c '.pending_domains // []' reports/phase0/latest-quality-summary.json)" >> "$GITHUB_OUTPUT"

      - name: Run opt-in PCF shadow parity (never published)
        id: pcf-shadow
        if: ${{ inputs.run_pcf_shadow == true && steps.collection.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          SHARE_PATH="$(jq -r '.combined_paths.sse_etf // empty' reports/phase0/latest-manifest.json)"
          if [[ -z "$SHARE_PATH" || ! -s "$SHARE_PATH" ]]; then
            echo "SSE ETF share artifact is unavailable; shadow parity is recorded as an input failure." >&2
            exit 1
          fi
          read -r -a DATES <<< "${{ steps.dates.outputs.dates }}"
          mkdir -p reports/pcf-shadow
          python scripts/run_pcf_shadow_parity.py \
            --shares "$SHARE_PATH" \
            --trade-date "${DATES[2]}" \
            --previous-date "${DATES[1]}" \
            --data-root ".shadow/pcf-v2/${DATES[2]}" \
            --output "reports/pcf-shadow/${DATES[2]}.json"
          jq '{status, tradeDate, coverage, comparison: {byCategory: .comparison.byCategory, unexpectedAnomalyCount: .comparison.unexpectedAnomalyCount}, budget}' \
            "reports/pcf-shadow/${DATES[2]}.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Record source readiness ledger
        id: readiness
        if: ${{ always() && steps.collection.outcome != 'cancelled' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ -z "$FLOW_INGEST_API_KEY" || -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
            exit 1
          fi
          TARGET_DATE="${{ steps.dates.outputs.latest }}"
          curl --silent --show-error --fail-with-body --retry 2 --retry-all-errors \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            "$FLOW_READINESS_URL?date=$TARGET_DATE" \
            --output previous-source-readiness.json || true
          python scripts/build_source_readiness.py \
            --manifest reports/phase0/latest-manifest.json \
            --quality reports/phase0/latest-quality-summary.json \
            --previous previous-source-readiness.json \
            --output source-readiness.json
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @source-readiness.json \
            "$FLOW_READINESS_URL" \
            --output source-readiness-response.json
          jq '{targetDate, state, pendingDomains, errorDomains, nextCheckAt}' source-readiness.json
          jq . source-readiness-response.json
          {
            echo "## Source readiness ledger"
            jq -r '
              "- target: \(.targetDate)\n" +
              "- state: \(.state)\n" +
              "- next check: \(.nextCheckAt // "none")\n" +
              "- pending: \((.pendingDomains // []) | join(", "))\n" +
              "- errors: \((.errorDomains // []) | join(", "))"
            ' source-readiness.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch independent PCF v2 checkpoint workflow
        id: pcf_dispatch
        if: ${{ success() && steps.collection.outputs.pending != 'true' && (steps.window.outputs.collection_window == 'evening' || steps.window.outputs.collection_window == 'morning') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg ref "main" \
            --arg dates "${{ steps.dates.outputs.latest }}" \
            --arg requiredDays "1" \
            '{ref:$ref,inputs:{dates:$dates,required_days:$requiredDays}}' \
            > pcf-dispatch-request.json
          STATUS_CODE="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data-binary @pcf-dispatch-request.json \
            --output pcf-dispatch-response.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/xiaoker/flow/actions/workflows/pcf-v2-capture.yml/dispatches")"
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "204" ]]; then
            echo "PCF v2 workflow dispatch failed with HTTP $STATUS_CODE; market publication remains independent." >&2
            jq . pcf-dispatch-response.json >&2 || true
            exit 1
          fi
          if [[ "$STATUS_CODE" == "200" ]] && ! jq -e '.workflow_run_id != null' pcf-dispatch-response.json >/dev/null; then
            echo "PCF v2 workflow dispatch returned HTTP 200 without a workflow_run_id." >&2
            jq . pcf-dispatch-response.json >&2 || true
            exit 1
          fi
          jq -n --arg workflow "pcf-v2-capture.yml" --arg dates "${{ steps.dates.outputs.latest }}" \
            '{status:"dispatched",workflow:$workflow,dates:$dates}' | tee pcf-dispatch-evidence.json

      - name: Build dashboard snapshot
        run: python scripts/build_dashboard_snapshot.py --output dashboard-snapshot-base.json

      - name: Reconcile evidence, mappings and dashboard values
        shell: bash
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot-base.json >/dev/null; then
            trading-desk qa-release --snapshot dashboard-snapshot-base.json
          else
            echo "Snapshot is pending source confirmation; raw data will be archived and the active dashboard remains unchanged."
            jq '.publication' dashboard-snapshot-base.json
            fi

      - name: Build full-source history archive bundle
        run: python scripts/build_history_bundle.py --snapshot dashboard-snapshot-base.json --output history-bundle.json

      - name: Archive all official raw and normalized sources
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/publish_history_artifacts.py \
            --bundle history-bundle.json \
            --url "https://flow.xiaoker.com/api/v1/admin/history-import"

      - name: Materialize final dashboard after ETF state import
        env:
          INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot-base.json >/dev/null; then
            if [[ -z "$INGEST_API_KEY" || -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
              echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
              exit 1
            fi
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "Authorization: Bearer $INGEST_API_KEY" \
              --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "https://flow.xiaoker.com/api/v1/admin/etf-state" \
              --output etf-flow-state.json
            python scripts/build_dashboard_snapshot.py \
              --state etf-flow-state.json \
              --output dashboard-snapshot.json \
              --stock-catalog-output stock-flow-catalog.json
            trading-desk qa-release \
              --snapshot dashboard-snapshot.json \
              --state etf-flow-state.json
          else
            cp dashboard-snapshot-base.json dashboard-snapshot.json
            echo "Pending snapshot has no ETF state materialization; active dashboard remains unchanged."
          fi

      - name: Check ETF stock-flow read-model readiness
        id: stock_flow
        if: ${{ success() }}
        shell: bash
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && jq -e '
            .publication.status == "confirmed" and
            .etfStockFlow.available == true and
            ((.etfStockFlow.coverage.stockCount // 0) > 0)
          ' dashboard-snapshot.json >/dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            jq '{asOf, available: .etfStockFlow.available, stockCount: .etfStockFlow.coverage.stockCount, matchedEtfCount: .etfStockFlow.coverage.matchedEtfCount}' dashboard-snapshot.json
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "ETF-to-stock PCF is not ready; preserving the previous immutable stock read models." >&2
            jq '{asOf, publication, etfStockFlow: {available: .etfStockFlow.available, coverage: .etfStockFlow.coverage, warnings: .etfStockFlow.warnings}}' dashboard-snapshot.json >&2
          fi

      - name: Prepare compact market history and previous manifest
        if: ${{ success() }}
        env:
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null; then
            AS_OF="$(jq -r '.asOf' dashboard-snapshot.json)"
            if [[ -z "$FLOW_CF_ACCESS_CLIENT_ID" || -z "$FLOW_CF_ACCESS_CLIENT_SECRET" ]]; then
              echo "Cloudflare Access headers are required to read the compact market-history endpoint." >&2
              exit 1
            fi
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
              "https://flow.xiaoker.com/api/v2/market-history?asOf=${AS_OF}" \
              --output market-history.json
            jq -e --arg asOf "$AS_OF" '
              (.rows | type == "array") and
              all(.rows[]?;
                (.trade_date | test("^[0-9]{4}-[0-9]{2}-[0-9]{2}$")) and
                (.trade_date <= $asOf)
              )
            ' market-history.json >/dev/null
            # The active manifest is only a read-only regression baseline. If
            # it cannot be fetched, fail closed rather than silently disabling
            # the history-length gate for this release.
            curl --fail-with-body --retry 3 --retry-all-errors \
              --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
              --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
              "https://flow.xiaoker.com/api/v2/releases/latest" \
              --output previous-release.json
            jq '{asOf: .asOf, releaseId: .releaseId, marketHistory: (.manifest.marketHistory // null)}' \
              previous-release.json
            jq '{asOf: .asOf, rows: (.rows | length), first: (.rows[0].trade_date // null), last: (.rows[-1].trade_date // null)}' \
              market-history.json
          else
            echo "Snapshot is not confirmed; compact market history is not needed."
          fi

      - name: Build verified archive and publish bundle
        run: |
          # The dashboard snapshot is published separately from read models.
          # Keeping this request limited to the core snapshot avoids making a
          # free Worker parse and hash every large view model in one request.
          python scripts/build_ingest_bundle.py --output ingest-bundle.json

      - name: Archive raw evidence and publish normalized data
        env:
          INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -z "$INGEST_API_KEY" || -z "$CF_ACCESS_CLIENT_ID" || -z "$CF_ACCESS_CLIENT_SECRET" ]]; then
            echo "FLOW_INGEST_API_KEY and both FLOW_CF_ACCESS_* secrets must be configured." >&2
            exit 1
          fi
          curl --fail-with-body --retry 3 --retry-all-errors \
            --header "Authorization: Bearer $INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @ingest-bundle.json \
            --output publish-response.json \
            "$PUBLISH_URL"
          jq -e '
            # A source-not-ready run is intentionally archived as pending.  It
            # must be treated as a successful transport step so the final gate
            # can preserve the active release without attempting to build
            # derived read models from incomplete inputs.
            (.status == "published" or
             .status == "already_published" or
             .status == "archived_pending") and
            (.readModelActivation == null or
             .readModelActivation == "activated" or
             .readModelActivation == "staged_older_than_active" or
             .readModelActivation == "staged_stale_revision")
          ' publish-response.json >/dev/null
          jq '{status, asOf, readModelReleaseId, readModelActivation}' publish-response.json

      - name: Build ETF-to-stock daily partitions from archived R2 inputs
        id: stock_flow_history
        if: ${{ !cancelled() && steps.collection.outputs.phase0_gate != 'pending' && steps.collection.outputs.phase0_gate != 'blocked' && steps.stock_flow.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          AS_OF="$(jq -r '.asOf' dashboard-snapshot.json)"
          write_history_status() {
            local status="$1"
            local error_code="${2:-}"
            jq -n \
              --arg status "$status" \
              --arg errorCode "$error_code" \
              --arg asOf "$AS_OF" \
              '{schemaVersion:1,status:$status,asOf:$asOf,errorCode:(if $errorCode == "" then null else $errorCode end)}' \
              > stock-flow-history-status.json
          }
          write_history_status "RUNNING"
          finalize_history_status() {
            local exit_code="$?"
            if (( exit_code != 0 )) && jq -e '.status == "RUNNING"' stock-flow-history-status.json >/dev/null 2>&1; then
              write_history_status "FAILED_RETRYABLE" "stock_flow_history_unexpected_failure"
            fi
            exit "$exit_code"
          }
          trap finalize_history_status EXIT
          # ETF penetration must use the ETF snapshot calendar. A complete
          # market-history date can be absent even when the official SSE ETF
          # anchor exists, so using the global calendar can silently skip the
          # actual previous trading day and reverse the calculated flow.
          jq -r --arg asOf "$AS_OF" \
            --slurpfile manifest reports/phase0/latest-manifest.json '
            (
              [.sourceSnapshots[]?.date] +
              [
                $manifest[0].artifacts[]?
                | select(
                    .source.source_id == "sse" and
                    .source.dataset == "etf_scale"
                  )
                | .requested_date
              ]
            )
            | map(select(type == "string" and . <= $asOf))
            | unique | .[-22:][]
          ' etf-flow-state.json > stock-flow-dates.txt
          if ! grep -qx "$AS_OF" stock-flow-dates.txt; then
            echo "ETF official snapshot dates do not include the current as-of date; refusing to build stock-flow history." >&2
            write_history_status "BLOCKED_QUALITY" "stock_flow_history_current_anchor_missing"
            exit 1
          fi
          if ! python scripts/fetch_stock_flow_history_inputs.py \
              --base-url "https://flow.xiaoker.com" \
              --dates stock-flow-dates.txt \
              --as-of "$AS_OF" \
              --output-dir stock-flow-inputs \
              --report stock-flow-fetch-report.json \
              --inventory pcf-inventory.json \
              --require-current; then
            write_history_status "FAILED_RETRYABLE" "stock_flow_history_input_fetch_failed"
            exit 1
          fi
          if ! python scripts/build_stock_flow_history.py \
              --shares stock-flow-inputs/shares.csv \
              --pcf stock-flow-inputs/pcf.csv \
              --dates stock-flow-dates.txt \
              --as-of "$AS_OF" \
              --output-dir stock-flow-partitions \
              --output stock-flow-history.json \
              --max-partitions 21 \
              --lineage-report stock-flow-fetch-report.json; then
            write_history_status "BLOCKED_QUALITY" "stock_flow_history_lineage_invalid"
            exit 1
          fi
          if ! jq -e --arg asOf "$AS_OF" '
              (.availableDates | index($asOf) != null) and
              (.partitions | length > 0)
            ' stock-flow-history.json >/dev/null; then
            write_history_status "BLOCKED_QUALITY" "stock_flow_history_current_partition_missing"
            exit 1
          fi
          write_history_status "READY"
          trap - EXIT

      - name: Publish ETF-to-stock daily partitions
        id: stock_flow_publish
        if: ${{ !cancelled() && steps.stock_flow_history.outcome == 'success' && steps.collection.outputs.phase0_gate != 'pending' && steps.collection.outputs.phase0_gate != 'blocked' && steps.stock_flow.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/publish_stock_flow_history.py \
            --partition-dir stock-flow-partitions \
            --index stock-flow-history.json \
            --url "https://flow.xiaoker.com/api/v1/admin/stock-flow-history"

      - name: Record collection resource budget
        if: ${{ always() }}
        shell: bash
        run: |
          mkdir -p reports/budget
          python scripts/report_stage_budget.py \
            --stage coreCollection \
            --run-key "$INPUT_RUN_KEY" \
            --actions-minutes 0 \
            --actions-run-attempt "${GITHUB_RUN_ATTEMPT:-1}" \
            --output reports/budget/core-collection.json

      - name: Verify immutable collection source bundle
        id: source_bundle
        if: ${{ success() && steps.collection.outputs.pending != 'true' && steps.collection.outputs.phase0_gate != 'blocked' && needs.pipeline_window_gate.outputs.delegate_publish == 'true' }}
        shell: bash
        run: |
          test -s dashboard-snapshot.json
          jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null
          if [[ -s stock-flow-catalog.json ]]; then
            test -s stock-flow-history-status.json
            jq -e '.status == "READY" or .status == "FAILED_RETRYABLE" or .status == "BLOCKED_QUALITY"' \
              stock-flow-history-status.json >/dev/null
          fi

      - name: Upload immutable collection source bundle
        id: source_artifact
        if: ${{ success() && steps.collection.outcome == 'success' && steps.source_bundle.outcome == 'success' && steps.collection.outputs.pending != 'true' && needs.pipeline_window_gate.outputs.delegate_publish == 'true' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: market-data-collection-source-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 3
          path: |
            dashboard-snapshot.json
            stock-flow-catalog.json
            stock-flow-history.json
            stock-flow-history-status.json
            market-history.json
            previous-release.json
            source-readiness.json
            source-readiness-response.json
            reports/budget/core-collection.json

      - name: Dispatch resumable market-data publish workflow
        id: publish_dispatch
        if: ${{ !cancelled() && needs.pipeline_window_gate.outputs.delegate_publish == 'true' && steps.source_artifact.outcome == 'success' && steps.collection.outputs.pending != 'true' && steps.collection.outputs.phase0_gate != 'blocked' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_ACTIONS_TOKEN || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_WORKFLOW_URL="https://api.github.com/repos/xiaoker/flow/actions/workflows/market-data-publish.yml/dispatches"
          ARTIFACT_NAME="market-data-collection-source-${{ github.run_id }}"
          jq -n \
            --arg ref "main" \
            --arg runKey "$INPUT_RUN_KEY" \
            --arg windowName "$INPUT_WINDOW_NAME" \
            --arg targetDate "$INPUT_TARGET_DATE" \
            --arg leaseOwner "$INPUT_LEASE_OWNER" \
            --arg contractVersion "$INPUT_CONTRACT_VERSION" \
            --arg sourceRunId "${{ github.run_id }}" \
            --arg artifactName "$ARTIFACT_NAME" \
            --arg gateEnabled "$PIPELINE_WINDOW_GATE_ENABLED" \
            '{ref:$ref,inputs:{run_key:$runKey,window_name:$windowName,target_date:$targetDate,lease_owner:$leaseOwner,contract_version:$contractVersion,source_run_id:$sourceRunId,artifact_name:$artifactName,gate_enabled:$gateEnabled}}' \
            > publish-dispatch-request.json
          STATUS_CODE="$(curl --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --header "Content-Type: application/json" \
            --data-binary @publish-dispatch-request.json \
            --output publish-dispatch-response.json \
            --write-out '%{http_code}' \
            "$PUBLISH_WORKFLOW_URL")"
          if [[ "$STATUS_CODE" != "200" && "$STATUS_CODE" != "204" ]]; then
            echo "market-data-publish dispatch failed with HTTP $STATUS_CODE" >&2
            jq . publish-dispatch-response.json >&2 || true
            exit 1
          fi
          if [[ "$STATUS_CODE" == "200" ]] && ! jq -e '.workflow_run_id != null' publish-dispatch-response.json >/dev/null; then
            echo "market-data-publish dispatch returned HTTP 200 without a workflow_run_id." >&2
            jq . publish-dispatch-response.json >&2 || true
            exit 1
          fi
          jq -n \
            --arg workflow "market-data-publish.yml" \
            --arg runKey "$INPUT_RUN_KEY" \
            --arg artifactName "$ARTIFACT_NAME" \
            --arg sourceRunId "${{ github.run_id }}" \
            '{status:"dispatched",workflow:$workflow,runKey:$runKey,sourceRunId:$sourceRunId,artifactName:$artifactName}' \
            | tee publish-dispatch-evidence.json
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          echo "Publish stage dispatched with source artifact $ARTIFACT_NAME."

      - name: Verify deployed dashboard read-model capabilities
        # PR2 delegates candidate construction/activation to
        # market-data-publish.yml.  Setting delegate_publish=false keeps this
        # entire block as an explicit rollback path for a manual run.
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null; then
            python scripts/check_release_capabilities.py --slot dashboard --output dashboard-capabilities.json
          else
            echo "Snapshot is not confirmed; skipping dashboard read-model capability preflight."
          fi

      - name: Build immutable dashboard and penetration read models offline
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null; then
            if [[ ! -s "market-history.json" ]]; then
              echo "market-history.json was not produced; refusing to build a truncated dashboard release." >&2
              exit 1
            fi
            HISTORY_ARGS=(--market-history market-history.json)
            if [[ -s "previous-release.json" ]]; then
              HISTORY_ARGS+=(--previous-manifest previous-release.json)
            fi
            if [[ "${{ steps.stock_flow.outputs.ready }}" == "true" ]]; then
              # Build pressure history from real daily ETF/PCF partitions. The
              # previous release is never treated as the historical source.
              if [[ -s "stock-flow-catalog.json" && -s "stock-flow-history.json" ]]; then
                python scripts/build_stock_pressure_state.py \
                  --catalog stock-flow-catalog.json \
                  --output stock-pressure-catalog.json \
                  --daily-partitions stock-flow-history.json
              else
                echo "stock-flow catalog/history is unavailable; cannot publish a pressure-consistent penetration release." >&2
                exit 1
              fi
              python scripts/build_read_models.py \
                --snapshot dashboard-snapshot.json \
                --output-dir read-models-full \
                --stock-catalog stock-pressure-catalog.json \
                --require-materialized \
                --producer-build-sha "${GITHUB_SHA}" \
                "${HISTORY_ARGS[@]}"
              python scripts/split_read_model_slots.py \
                --source-dir read-models-full \
                --output-dir read-models-dashboard \
                --slot dashboard
              python scripts/split_read_model_slots.py \
                --source-dir read-models-full \
                --output-dir read-models-penetration \
                --slot etf_penetration
              python scripts/report_read_model_sizes.py \
                --read-model-dir read-models-full \
                --output artifact-size-report.json
            else
              # Core market pages do not depend on PCF. Publish their slot
              # from the confirmed snapshot even while penetration is pending.
              python scripts/build_read_models.py \
                --slot dashboard \
                --snapshot dashboard-snapshot.json \
                --output-dir read-models-dashboard \
                --require-materialized \
                --producer-build-sha "${GITHUB_SHA}" \
                "${HISTORY_ARGS[@]}"
              python scripts/report_read_model_sizes.py \
                --read-model-dir read-models-dashboard \
                --output artifact-size-report.json
            fi
            if jq -e '.softWarnings | length > 0' artifact-size-report.json >/dev/null; then
              echo '::warning::One or more read-model artifacts exceed the PR2 soft budget.'
              jq -r '.softWarnings[]' artifact-size-report.json
            fi
          else
            echo "Snapshot is not confirmed; preserving raw evidence only."
          fi

      - name: Stage immutable dashboard read-model candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ "${{ steps.collection.outputs.phase0_gate }}" != "pending" && \
                "${{ steps.collection.outputs.phase0_gate }}" != "blocked" ]] && \
             jq -e '.publication.status == "confirmed"' dashboard-snapshot.json >/dev/null && \
            [[ -s "read-models-dashboard/manifest.json" ]]; then
            python scripts/publish_read_models.py \
              --read-model-dir read-models-dashboard \
              --slot dashboard \
              --stage-only \
              --result-output dashboard-read-model-publish.json
          else
            echo "Dashboard candidate was not built or snapshot is not confirmed; preserving raw evidence only."
          fi

      - name: Verify staged dashboard read-model candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-dashboard/manifest.json" && -s "dashboard-read-model-publish.json" ]] && \
            jq -e '.status == "staged_candidate"' dashboard-read-model-publish.json >/dev/null; then
            RELEASE_ID="$(jq -r '.releaseId' read-models-dashboard/manifest.json)"
            AS_OF="$(jq -r '.asOf' read-models-dashboard/manifest.json)"
            python scripts/verify_published_release.py \
              --release-id "$RELEASE_ID" \
              --as-of "$AS_OF" \
              --slot dashboard \
              --candidate > dashboard-release-canary.json
          else
            echo "Dashboard candidate was not staged; active dashboard was not changed."
          fi

      - name: Activate canary-verified dashboard candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-dashboard/manifest.json" && -s "dashboard-release-canary.json" ]] && \
            jq -e '.mode == "candidate" and .slot == "dashboard"' dashboard-release-canary.json >/dev/null; then
            RELEASE_ID="$(jq -r '.releaseId' read-models-dashboard/manifest.json)"
            AS_OF="$(jq -r '.asOf' read-models-dashboard/manifest.json)"
            python scripts/activate_read_models.py \
              --release-id "$RELEASE_ID" \
              --as-of "$AS_OF" \
              --slot dashboard > dashboard-read-model-activation.json
            jq -e --arg releaseId "$RELEASE_ID" --arg asOf "$AS_OF" \
              '.releaseId == $releaseId and .asOf == $asOf and .slot == "dashboard" and (.status == "activated" or .status == "staged_older_than_active" or .status == "staged_stale_revision")' \
              dashboard-read-model-activation.json >/dev/null
          else
            echo "Dashboard candidate canary did not pass; active dashboard was not changed."
          fi

      - name: Verify deployed penetration capabilities
        id: penetration_capabilities
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' && steps.stock_flow.outputs.ready == 'true' }}
        continue-on-error: true
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-penetration/manifest.json" ]]; then
            python scripts/check_release_capabilities.py --slot etf_penetration --output penetration-capabilities.json
          else
            echo "Penetration candidate was not built; preserving the previous penetration slot."
          fi

      - name: Stage immutable penetration candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' && steps.penetration_capabilities.outcome == 'success' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-penetration/manifest.json" ]]; then
            python scripts/publish_read_models.py \
              --read-model-dir read-models-penetration \
              --slot etf_penetration \
              --stage-only \
              --result-output penetration-read-model-publish.json
          else
            echo "Penetration candidate was not built; preserving the previous penetration slot."
          fi

      - name: Verify staged penetration candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' && steps.penetration_capabilities.outcome == 'success' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-penetration/manifest.json" && -s "penetration-read-model-publish.json" ]] && \
            jq -e '.status == "staged_candidate"' penetration-read-model-publish.json >/dev/null; then
            RELEASE_ID="$(jq -r '.releaseId' read-models-penetration/manifest.json)"
            AS_OF="$(jq -r '.asOf' read-models-penetration/manifest.json)"
            python scripts/verify_published_release.py \
              --release-id "$RELEASE_ID" \
              --as-of "$AS_OF" \
              --slot etf_penetration \
              --candidate > penetration-release-canary.json
          else
            echo "Penetration candidate was not staged; preserving the previous penetration slot."
          fi

      - name: Activate canary-verified penetration candidate
        if: ${{ success() && needs.pipeline_window_gate.outputs.delegate_publish != 'true' && steps.penetration_capabilities.outcome == 'success' }}
        env:
          FLOW_INGEST_API_KEY: ${{ secrets.FLOW_INGEST_API_KEY }}
          FLOW_CF_ACCESS_CLIENT_ID: ${{ secrets.FLOW_CF_ACCESS_CLIENT_ID }}
          FLOW_CF_ACCESS_CLIENT_SECRET: ${{ secrets.FLOW_CF_ACCESS_CLIENT_SECRET }}
        run: |
          if [[ -s "read-models-penetration/manifest.json" && -s "penetration-release-canary.json" ]] && \
            jq -e '.mode == "candidate" and .slot == "etf_penetration"' penetration-release-canary.json >/dev/null; then
            RELEASE_ID="$(jq -r '.releaseId' read-models-penetration/manifest.json)"
            AS_OF="$(jq -r '.asOf' read-models-penetration/manifest.json)"
            python scripts/activate_read_models.py \
              --release-id "$RELEASE_ID" \
              --as-of "$AS_OF" \
              --slot etf_penetration > penetration-read-model-activation.json
            jq -e --arg releaseId "$RELEASE_ID" --arg asOf "$AS_OF" \
              '.releaseId == $releaseId and .asOf == $asOf and .slot == "etf_penetration" and (.status == "activated" or .status == "staged_older_than_active" or .status == "staged_stale_revision")' \
              penetration-read-model-activation.json >/dev/null
          else
            echo "Penetration candidate canary did not pass; previous penetration slot remains active."
          fi

      - name: Fail loudly on unresolved source errors
        if: always()
        shell: bash
        run: |
          history_status="$(jq -r '.status // "NOT_REQUIRED"' stock-flow-history-status.json 2>/dev/null || echo "NOT_REQUIRED")"
          if [[ "$history_status" == "BLOCKED_QUALITY" || "$history_status" == "FAILED_RETRYABLE" ]]; then
            echo "ETF-to-stock history did not complete: $history_status" >&2
            jq . stock-flow-history-status.json >&2
            exit 1
          fi
          errors="$(jq '.errors | length' reports/phase0/latest-quality-summary.json)"
          gate="$(jq -r '.phase0_gate_status' reports/phase0/latest-quality-summary.json)"
          collection_window="${{ steps.window.outputs.collection_window }}"
          source_pending="${{ steps.collection.outputs.pending }}"
          if [[ "$errors" -gt 0 || "$gate" == "blocked" ]]; then
            # A source that has not published the requested date is a normal
            # release-timing state. Preserve the raw response and let the
            # bounded follow-up windows retry it. Transport, schema and data
            # quality errors remain hard failures.
            if [[ "$errors" -eq 0 && "$source_pending" == "true" ]]; then
              echo "Official source timing is pending; raw evidence was archived and a later reconciliation window will retry."
              exit 0
            fi
            echo "Collection archived partial evidence but still has unresolved source errors." >&2
            jq '{phase0_gate_status, errors, findings: [.findings[] | select(.status != "pass")]}' \
              reports/phase0/latest-quality-summary.json >&2
            exit 1
          fi

      - name: Mark pipeline window terminal status
        # When publish is delegated, only the publish workflow is allowed to
        # close the pipeline window. A collection failure or failed dispatch
        # still closes it as FAILED_RETRYABLE/BLOCKED_QUALITY here.
        if: always() && needs.pipeline_window_gate.outputs.gate_enabled == 'true' && steps.publish_dispatch.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          STATUS="COMPLETED"
          ERROR_CODE=""
          HISTORY_STATUS="$(jq -r '.status // "NOT_REQUIRED"' stock-flow-history-status.json 2>/dev/null || echo "NOT_REQUIRED")"
          if [[ "$HISTORY_STATUS" == "BLOCKED_QUALITY" ]]; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="stock_flow_history_incomplete"
          elif [[ "$HISTORY_STATUS" == "FAILED_RETRYABLE" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="stock_flow_history_fetch_failed"
          elif [[ -s stock-flow-catalog.json && ! -s stock-flow-history.json ]]; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="stock_flow_history_missing"
          elif [[ "${{ job.status }}" != "success" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="workflow_failed"
          elif [[ "${{ steps.publish_dispatch.outcome }}" == "failure" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="publish_dispatch_failed"
          elif [[ "${{ steps.collection.outputs.pending }}" == "true" ]]; then
            STATUS="FAILED_RETRYABLE"
            ERROR_CODE="source_not_ready"
          elif jq -e '(.errors | length > 0) or (.phase0_gate_status == "blocked")' reports/phase0/latest-quality-summary.json >/dev/null 2>&1; then
            STATUS="BLOCKED_QUALITY"
            ERROR_CODE="quality_gate_blocked"
          fi
          jq -n \
            --arg runKey "$INPUT_RUN_KEY" \
            --arg leaseOwner "$INPUT_LEASE_OWNER" \
            --arg githubRunId "${{ github.run_id }}" \
            --arg status "$STATUS" \
            --arg errorCode "$ERROR_CODE" \
            '{runKey:$runKey,leaseOwner:$leaseOwner,githubRunId:$githubRunId,status:$status,errorCode:(if $errorCode == "" then null else $errorCode end)}' \
            > pipeline-window-terminal.json
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer $FLOW_INGEST_API_KEY" \
            --header "CF-Access-Client-Id: $FLOW_CF_ACCESS_CLIENT_ID" \
            --header "CF-Access-Client-Secret: $FLOW_CF_ACCESS_CLIENT_SECRET" \
            --header "Content-Type: application/json" \
            --data-binary @pipeline-window-terminal.json \
            "$FLOW_PIPELINE_WINDOW_URL/status" \
            --output pipeline-window-terminal-response.json

      - name: Preserve run evidence
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0, Node 24
        with:
          name: market-data-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            dashboard-snapshot.json
            dashboard-snapshot-base.json
            etf-flow-state.json
            stock-flow-catalog.json
            stock-pressure-catalog.json
            stock-flow-dates.txt
            stock-flow-inputs/**
            stock-flow-partitions/**
            stock-flow-history.json
            stock-flow-history-status.json
            stock-flow-fetch-report.json
            pcf-inventory.json
            market-history.json
            previous-release.json
            artifact-size-report.json
            dashboard-capabilities.json
            penetration-capabilities.json
            dashboard-read-model-publish.json
            dashboard-release-canary.json
            dashboard-read-model-activation.json
            penetration-read-model-publish.json
            penetration-release-canary.json
            penetration-read-model-activation.json
            source-readiness.json
            source-readiness-response.json
            previous-source-readiness.json
            reports/phase0/latest-manifest.json
            reports/phase0/latest-quality-summary.json
            reports/phase0/latest-release-qa.json
            reports/pcf-shadow/*.json
            reports/budget/core-collection.json
            publish-dispatch-request.json
            publish-dispatch-response.json
            publish-dispatch-evidence.json
            pcf-dispatch-request.json
            pcf-dispatch-response.json
            pcf-dispatch-evidence.json
            reports/backfill/latest-summary.json
            history-bundle.json
            read-models-full/
            read-models-dashboard/
            read-models-penetration/
            publish-response.json
